<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毁灭弹道</title>
<style>
:root{--bg:#2a3220;--fg:#efebd2;--mut:#aab38c;--card:#353d2c;--bd:#4b553a;--zr:#8b4a3d;--zg:#5e7a45;--zb:#48697f;--ac:#f0b429;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;color:var(--fg);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;line-height:1.5}
body{background-color:#232a1b;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 42px),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 42px),radial-gradient(ellipse at 50% 0,rgba(130,150,75,.28),transparent 70%);min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:10px 10px 28px}
h1{font-size:22px;margin:8px 0}h2{font-size:16px;margin:6px 0;letter-spacing:.04em}
p{margin:6px 0}.mut{color:var(--mut);font-size:13px}.warn{color:#ffa07f;font-weight:700}
.bd{display:grid;grid-template-columns:18px repeat(9,1fr);gap:1px;background:#1a2014;padding:5px;border:2px solid #8a936f;border-radius:4px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,3.6vw,16px);font-weight:700;border:1px solid var(--bd);cursor:pointer;position:relative;user-select:none}
.z0{background:var(--zr)}.z1{background:var(--zg)}.z2{background:var(--zb)}
.lab{font-size:11px;color:var(--mut);display:flex;align-items:center;justify-content:center}
.mid{text-align:center;font-size:12px;color:var(--mut);border-top:3px double var(--bd);margin:6px 0 4px;padding-top:2px}
.rng{box-shadow:inset 0 0 0 2px var(--ac)}
.ruin{background-color:#2e2521;background-image:radial-gradient(circle at 28% 32%,#6a5648 0 2px,transparent 3px),radial-gradient(circle at 70% 66%,#120d0b 0 3px,transparent 4px),repeating-linear-gradient(135deg,rgba(255,90,20,.2) 0 3px,transparent 3px 8px);border-color:#8a3a14;color:#ffcc80}
.ex{background-image:linear-gradient(rgba(224,36,94,.38),rgba(224,36,94,.38));border-color:#e0245e;animation:exp 1.3s ease-in-out infinite}
@keyframes exp{50%{filter:brightness(1.35) saturate(1.5)}}
.ex2{background-image:linear-gradient(rgba(224,36,94,.24),rgba(224,36,94,.24));border-color:#e0245e}
.scan{background-image:linear-gradient(rgba(0,170,210,.36),rgba(0,170,210,.36));border-color:#0097c4}
.fire{background-image:linear-gradient(rgba(255,120,0,.6),rgba(255,120,0,.6));animation:fl .35s ease-in-out 3}
@keyframes fl{50%{filter:brightness(1.7)}}
.imp{outline:3px solid #ffd400;outline-offset:-3px;animation:fl .3s ease-in-out infinite}
.boom::before,.dust::before{content:"";position:absolute;inset:0;pointer-events:none}
.boom::before{background:radial-gradient(circle,#fff 0,#ffb300 30%,#e53935 60%,transparent 72%);animation:bm .8s ease-out forwards}
.dust::before{border:2px solid var(--mut);border-radius:50%;animation:bm .7s ease-out forwards}
@keyframes bm{from{transform:scale(.2);opacity:1}to{transform:scale(1.7);opacity:0}}
/* 轰炸机 / 战术飞弹：持续更久的火光、火花和余烬 */
.blast::before,.blast::after{content:"";position:absolute;pointer-events:none}
.blast::before{inset:-35%;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff3a0 18%,#ffb300 38%,#ff5722 58%,rgba(120,20,0,.55) 72%,transparent 80%);animation:bl 1.9s ease-out forwards;z-index:3}
.blast::after{left:50%;top:50%;width:5px;height:5px;margin:-2px 0 0 -2px;border-radius:50%;background:#fff;box-shadow:14px -12px 0 #ffd54f,-16px -8px 0 #ff9800,10px 16px 0 #ff5722,-12px 14px 0 #fff59d,0 -20px 0 #ffeb3b,20px 3px 0 #ff7043,-21px 1px 0 #ffca28,6px -22px 0 #fff,-8px 21px 0 #ffab40;animation:sp 2.2s ease-out forwards;z-index:4}
.mega::before{inset:-60%;animation-duration:2.6s}
.mega::after{animation:sp2 3s ease-out forwards}
@keyframes bl{0%{transform:scale(.15);opacity:1}25%{opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes sp{0%{transform:scale(.2);opacity:1}60%{opacity:.95}100%{transform:scale(2.8);opacity:0}}
@keyframes sp2{0%{transform:scale(.2);opacity:1}60%{opacity:.95}100%{transform:scale(4.6);opacity:0}}
.ember{animation:em 3s ease-out forwards}
@keyframes em{0%{box-shadow:inset 0 0 14px 4px rgba(255,140,0,.95)}100%{box-shadow:inset 0 0 0 0 rgba(255,140,0,0)}}
.sflash{animation:sf 1.1s ease-out}
@keyframes sf{0%{filter:brightness(2.2)}100%{filter:brightness(1)}}
@media (prefers-reduced-motion:reduce){.ex,.fire,.imp{animation:none}.boom::before,.dust::before,.blast::before,.blast::after,.ember,.sflash{animation-duration:.01s}}
.tg{outline:3px solid var(--ac);outline-offset:-3px;background-image:repeating-linear-gradient(45deg,var(--ac) 0 5px,transparent 5px 10px)}.tgl{outline:3px solid var(--fg);outline-offset:-3px;background-image:repeating-linear-gradient(45deg,var(--fg) 0 5px,transparent 5px 10px)}
.tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-weight:700;line-height:1.3;background:#c4123f;color:#fff;padding:0 4px;border-radius:3px;pointer-events:none;z-index:2;box-shadow:0 0 0 1px #fff8}
.tag.t2{background:#0b6e8a}.tag.e{background:#6b7b88;opacity:.9;font-weight:400}
.sel{outline:3px solid var(--fg);outline-offset:-3px}
.pl::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--ac)}.lk::after{content:"✓";position:absolute;top:0;right:2px;font-size:11px;color:var(--fg)}
.box{background:var(--card);border:1px solid #6f7a54;border-radius:5px;padding:8px 10px;margin:8px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 rgba(0,0,0,.35)}
.info{border-color:#0097c4}
.crd{border-top:1px solid var(--bd);padding:5px 0}.crd:first-of-type{border-top:0}
.crd .cs{font-size:14px}
button{font:inherit;padding:8px 12px;margin:3px 4px 3px 0;border:1px solid #98a27b;background:linear-gradient(#69735a,#4a533d);color:#f4f0da;border-radius:4px;cursor:pointer;text-shadow:0 1px 0 rgba(0,0,0,.55);box-shadow:0 2px 0 #1d2316,inset 0 1px 0 rgba(255,255,255,.18)}
button:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 #1d2316}
button.main{background:linear-gradient(#e2bf62,#a97f2a);color:#1d190b;border-color:#f3dc92;text-shadow:0 1px 0 rgba(255,255,255,.35);font-weight:700}
button:disabled{opacity:.45;cursor:default}
button.sm{padding:4px 8px;font-size:13px}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pass{background:#000;color:#fff;border-radius:6px;padding:60px 16px;text-align:center;min-height:50vh}
.pass button{background:#fff;color:#000;border-color:#fff}
.log p{margin:3px 0;font-size:14px}
.fb{border-bottom:2px dashed #e6dfb0}
.u0{box-shadow:inset 0 0 0 3px #4aa3ff}.u1{box-shadow:inset 0 0 0 3px #ff5a6e}
.hs{outline:3px solid #ff8a00;outline-offset:-3px;filter:brightness(1.15)}
.ht{background-image:repeating-linear-gradient(45deg,#ffd400 0 5px,transparent 5px 10px)}
.hh{background-image:linear-gradient(rgba(224,36,36,.55),rgba(224,36,36,.55))}
.hf{outline:2px dashed #555;outline-offset:-3px}.hto{outline:3px solid #19a34a;outline-offset:-3px}
/* ===== 开始画面：作战沙盘风格 ===== */
.hero{position:relative;text-align:center;padding:26px 8px 18px;margin:6px 0 10px;border:2px solid #b9a45a;border-radius:6px;background:linear-gradient(rgba(20,26,14,.55),rgba(20,26,14,.8)),repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 22px);box-shadow:inset 0 0 0 4px rgba(0,0,0,.35),0 3px 0 rgba(0,0,0,.45)}
.hero .crest{color:#e2bf62;letter-spacing:.5em;font-size:14px;text-shadow:0 1px 0 #000}
.hero .ttl{font-family:Impact,"Arial Black","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-weight:900;font-size:clamp(40px,12vw,60px);letter-spacing:.18em;margin:6px 0 2px;color:#f3e7b0;text-shadow:0 2px 0 #7a5a12,0 4px 0 #000,0 0 18px rgba(240,180,41,.35)}
.hero .sub{color:#c9d1a8;letter-spacing:.3em;font-size:13px}
.hero .tick{position:absolute;font-size:11px;color:#c9d1a8;opacity:.7;font-family:ui-monospace,Menlo,monospace}.hero .tl{left:8px;top:6px}.hero .br{right:8px;bottom:6px}
.sec{margin:14px 0 4px;color:#e2bf62;letter-spacing:.2em;font-size:13px;border-bottom:1px solid #6f7a54;padding-bottom:3px}
button.wide{display:block;width:100%;margin:6px 0;padding:12px 14px;font-size:17px;letter-spacing:.08em}
button.wide span{font-size:12px;opacity:.8;letter-spacing:0;margin-left:6px}
.row3{display:flex;gap:6px}.row3 button{flex:1;margin:4px 0;padding:10px 4px;line-height:1.3}
.row3 b{color:#f0b429;font-size:15px;letter-spacing:.1em}
details.box summary{cursor:pointer;color:#e2bf62;letter-spacing:.1em}
select{font:inherit;padding:4px 6px;background:#3d4632;color:var(--fg);border:1px solid #98a27b;border-radius:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const R=6,C=9,NAME={M:"迫击炮",H:"榴弹炮",R:"火箭炮"},CH={M:"迫",H:"榴",R:"火"},MAXR={M:8,H:10,R:99},ZN=["红","绿","蓝"],Q=["M","M","M","H","H","R"];
const SUBN=["红前","红后","绿前","绿后","蓝前","蓝后"];
const subOf=(r,c)=>Math.floor(c/3)*2+(r>=3?1:0);
const subCells=i=>{const z=i>>1,r0=i%2?3:0,o=[];for(let r=r0;r<r0+3;r++)for(let c=3*z;c<3*z+3;c++)o.push([r,c]);return o};
const CARDS={scout:"侦察兵",spy:"间谍",radar:"雷达",drone:"无人机",camo:"伪装网",sat:"红外线卫星",bomb:"轰炸机",heli:"直升机",carrier:"运兵车",reinf:"增援",missile:"陆军战术飞弹"};
const CORDER=["scout","spy","radar","drone","camo","sat","bomb","heli","carrier","reinf","missile"];
const DESC={scout:"指定一个小区，下下回合公布那 9 格有什么；冷却 3 回合",spy:"随机暴露对手一门炮的精确格；整局 1 次",radar:"第 18–20 回合：对手火箭炮开火那回合，显示它移动的方向和格数；整局 1 次",drone:"随机查出对手一门迫击炮所在的小区，当回合结算；冷却 3 回合",camo:"本回合挡掉对手的侦察兵、间谍、无人机、雷达；整局 2 次，隔一回合可再用",sat:"第 19–20 回合：显示对手所有炮的精确位置，挡不住；整局 1 次",bomb:"选起点和方向，炸一条 6 格的线；冷却 10 回合",heli:"把一门迫击炮送到己方任意空格，该炮本回合和下回合不能开火；冷却 5 回合",carrier:"同直升机，但只能在同一颜色大区内；冷却 5 回合",reinf:"原来 3 门迫击炮全毁后，第 1–10 回合内增加 1 门迫击炮；整局 1 次",missile:"第 11 回合强制：炸 3×3，那 9 格成为永久废墟"};
const DIRV={U:[1,0],D:[-1,0],L:[0,-1],R:[0,1]},DIRS={U:"往上",D:"往下",L:"往左",R:"往右"};
const $=s=>document.querySelector(s);
const lab=(r,c)=>String.fromCharCode(65+r)+(c+1);
let G,UI,ID=0,AC=null,MUTE=false;
const mk=()=>Array.from({length:R},()=>Array(C).fill(""));
const mkn=()=>Array.from({length:R},()=>Array(C).fill(0));
const mkb=()=>Array.from({length:R},()=>Array(C).fill(false));
const newCards=()=>({scout:-99,drone:-99,camo:-99,bomb:-99,heli:-99,carrier:-99,camoN:0,spy:false,radar:false,sat:false,reinf:false,missile:false});
const cp2=a=>a.map(m=>m.map(r=>[...r]));
const left=()=>G.units[G.p].filter(u=>u.alive&&!(G.plans[G.p][u.id]||{}).lock).length;
const lineCells=b=>{const[dr,dc]=DIRV[b.d],o=[];for(let i=0;i<6;i++){const r=b.r+dr*i,c=b.c+dc*i;if(r>=0&&r<R&&c>=0&&c<C)o.push([r,c])}return o};
const blk3=m=>{const o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const r=m.r+dr,c=m.c+dc;if(r>=0&&r<R&&c>=0&&c<C)o.push([r,c])}return o};
const mshow=(m,xt,turn)=>m=="x"?(turn-xt<=3?"·":""):(m=="#"||!m)?"":"✕"+CH[m];

/* ===== 声音（浏览器合成） ===== */
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=="suspended")AC.resume();return AC}
function tone(f,d,type,v,t0,f2){const a=ac();if(!a||MUTE)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(t0||0);o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}
function noise(d,v,t0,fr,type){const a=ac();if(!a||MUTE)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+(t0||0);s.buffer=b;f.type=type||"lowpass";f.frequency.value=fr;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(a.destination);s.start(t)}
const SFX={selM(){tone(880,.08,"triangle",.1,0,660)},selH(){tone(110,.18,"triangle",.18,0,80)},selR(){noise(.12,.12,0,3000,"highpass")},tick(){tone(1200,.03,"square",.04)},lock(){tone(700,.04,"square",.08);tone(500,.06,"square",.08,.05)},pass(){tone(440,.15,"sine",.1);tone(330,.2,"sine",.1,.15)},card(){tone(660,.08,"triangle",.1);tone(990,.12,"triangle",.1,.08)},fireM(){tone(140,.25,"sawtooth",.2,0,60);noise(.2,.25,0,900)},fireH(){tone(70,.6,"sawtooth",.3,0,35);noise(.5,.4,0,500)},fireR(){noise(1.1,.25,0,2500,"highpass");tone(200,.9,"sawtooth",.1,0,600)},hit(){noise(.7,.45,0,400);tone(60,.5,"sine",.35,0,30)},miss(){noise(.25,.12,0,300);tone(90,.2,"sine",.12,0,60)},
 bomb(){noise(1.6,.5,0,350);tone(55,1.4,"sawtooth",.35,0,28);noise(1,.25,.15,1800,"highpass")},
 missile(){noise(1.5,.3,0,2800,"highpass");tone(300,1,"sawtooth",.12,0,900);noise(2.2,.6,.9,260);tone(40,2,"sine",.5,.9,22)}};
const sfx=n=>{try{SFX[n]()}catch(e){}};

function init(){G={turn:1,ph:"start",p:0,units:[[],[]],marks:[mk(),mk()],xt:[mkn(),mkn()],plans:[{},{}],log:[],queue:[...Q],next:null,over:null,mode:"pvp",diff:0,lost:[{M:0,H:0,R:0},{M:0,H:0,R:0}],seen:[[],[]],cards:[newCards(),newCards()],cp:[{},{}],ruin:[mkb(),mkb()],inbox:[[],[]],rev:[[],[]],pend:[[],[]],events:[],hist:[],cardlog:[[],[]],noAnim:false};UI={sel:null,mode:null,cm:null,msg:""}}
const unitAt=(p,r,c)=>G.units[p].find(u=>u.alive&&u.r==r&&u.c==c);
const selUnit=()=>G.units[G.p].find(u=>u.id==UI.sel&&u.alive);
const plan=u=>G.plans[G.p][u.id]||(G.plans[G.p][u.id]={});
const dist=(u,r,c)=>u.r+r+1+Math.abs(u.c-c);
function cellsFor(u,r,c){
 if(u.t=="M")return[[r,c]];
 if(u.t=="H"){if(r>R-2||c>C-2)return null;return[[r,c],[r+1,c],[r,c+1],[r+1,c+1]]}
 return[[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([a,b])=>a>=0&&a<R&&b>=0&&b<C)}
const inRange=(u,cells)=>Math.min(...cells.map(([a,b])=>dist(u,a,b)))<=MAXR[u.t];
function reveal(u){
 if(u.t=="M")return ZN[Math.floor(u.c/3)]+"区";
 if(u.t=="H")return ZN[Math.floor(u.c/3)]+(u.r<3?"前":"后");
 return lab(u.r,u.c)}
function rvx(u){return u.t=="M"?reveal(u)+"（整个大区）":u.t=="H"?reveal(u)+"小区（9 格）":reveal(u)+"（精确格）"}
function expCells(u){const z=Math.floor(u.c/3),o=[];
 if(u.t=="R")return[[u.r,u.c]];
 const r0=u.t=="M"?0:(u.r<3?0:3),r1=u.t=="M"?R-1:(u.r<3?2:5);
 for(let r=r0;r<=r1;r++)for(let c=3*z;c<=3*z+2;c++)o.push([r,c]);return o}
function region(u){const z=Math.floor(u.c/3);
 if(u.t=="M")return{t:"M",turn:G.turn,c0:3*z,c1:3*z+2,r0:0,r1:R-1};
 if(u.t=="H"){const f=u.r<3;return{t:"H",turn:G.turn,c0:3*z,c1:3*z+2,r0:f?0:3,r1:f?2:5}}
 return{t:"R",turn:G.turn,c0:u.c,c1:u.c,r0:u.r,r1:u.r}}
function forgetSeen(p,t,r,c){const L=G.seen[p];
 if(t=="H"){const e=[...L].reverse().find(e=>e.t=="H"&&r>=e.r0&&r<=e.r1&&c>=e.c0&&c<=e.c1);
  if(e)for(let i=L.length-1;i>=0;i--)if(L[i].t=="H"&&L[i].c0==e.c0&&L[i].r0==e.r0)L.splice(i,1);return}
 for(let i=L.length-1;i>=0;i--){const e=L[i];if(e.t==t&&(t=="R"||(c>=e.c0-1&&c<=e.c1+1))){L.splice(i,1);return}}}
const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)],shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]),rg=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const DN=["简单","中等","困难"],pn=p=>G.mode=="cpu"&&p==1?"电脑":"玩家"+(p+1),wn=p=>G.mode=="cpu"&&p==1?"电脑":"玩家 "+(p+1);

/* ===== 卡片可用性：返回空字符串表示现在可以用 ===== */
function cardWhy(p,k){
 const t=G.turn,K=G.cards[p],cd=(last,n)=>{const w=n-(t-last);return w>0?"冷却中，还需 "+w+" 回合":""};
 if(k=="scout"||k=="drone")return cd(K[k],3);
 if(k=="camo"){if(K.camoN>=2)return"两次已用完";const w=2-(t-K.camo);return w>0?"休息中，还需 "+w+" 回合":""}
 if(k=="bomb")return cd(K.bomb,10);
 if(k=="heli"||k=="carrier"){const w=cd(K[k],5);if(w)return w;return G.units[p].some(u=>u.alive&&u.t=="M")?"":"没有迫击炮可运"}
 if(k=="spy")return K.spy?"已用过":"";
 if(k=="radar")return K.radar?"已用过":(t<18?"第 18 回合起才能用":"");
 if(k=="sat")return K.sat?"已用过":(t<19?"第 19 回合起才能用":"");
 if(k=="reinf"){if(K.reinf)return"已用过";if(t>10)return"第 11 回合起不能再用";if(G.lost[p].M<3)return"原来 3 门迫击炮全毁后才能用";return""}
 if(k=="missile")return K.missile?"已发射":(t==11?"":"只在第 11 回合")
 return""}
/* 运输 / 增援的落点是否可用（己方半场的格子） */
function destFree(p,r,c){
 if(G.ruin[p][r][c])return"那里是废墟，炮不能进入。";
 if(G.units[p].some(x=>x.alive&&x.r==r&&x.c==c))return"那一格已有炮。";
 if(Object.values(G.plans[p]).some(x=>x.move&&x.move[0]==r&&x.move[1]==c))return"已有别的炮要移到那里。";

const cellEl=(p,r,c)=>document.querySelector(`[data-s="${p}"][data-r="${r}"][data-c="${c}"]`);
const fname=p=>G.mode=="cpu"?(p==1?"电脑阵地":"你的阵地"):"玩家 "+(p+1)+" 阵地";

 rows.forEach(r=>{h+=`<span class="lab">${String.fromCharCode(65+r)}</span>`;
  for(let c=0;c<C;c++){h+=`<div class="cell z${Math.floor(c/3)}${G.prevRuin[p][r][c]?" ruin":""}" data-s="${p}" data-r="${r}" data-c="${c}">${G.prevRuin[p][r][c]?"":mshow(G.prevMarks[1-p][r][c],G.prevXt[1-p][r][c],G.turn)}</div>`}});

 +`<div id="fin" style="display:${has?"none":"block"}"><div class="box log">${G.log.map(x=>`<p>${x}</p>`).join("")}</div>${G.over?`<h1>${G.over}</h1><button class="main" data-a="replay">战争日志（回放）</button><button data-a="again">再玩一局</button>`:`<button class="main" data-a="cont">下一回合</button>`}</div>`}
function finishAnim(){
 (G.events||[]).forEach(e=>{
  if(e.kind=="shot")e.ex.forEach(([r,c])=>{const x=cellEl(e.p,r,c);if(x){x.classList.remove("fire");x.classList.add("ex")}});
  e.cells.forEach(([r,c])=>{const x=cellEl(1-e.p,r,c);if(!x)return;x.classList.remove("imp","boom","dust","blast","mega","ember");
   if(e.kind=="missile"){x.classList.add("ruin");x.textContent="";return}
   if(G.ruin[1-e.p][r][c])return;
   const h=e.hits.find(q=>q[0]==r&&q[1]==c);if(h)x.textContent="✕"+CH[h[2]];else if(!x.textContent)x.textContent="·"})});
 const s=$("#stage");if(s)s.classList.remove("sflash");
 const f=$("#fin"),sk=$("#skip"),c=$("#cap");if(f)f.style.display="block";if(sk)sk.style.display="none";if(c)c.textContent="红色标记 = 本回合开火暴露的位置，下回合对手的棋盘上会继续标出。"}
async function startAnim(){
 const id=++ANIM.id,ev=G.events||[];if(!ev.length)return;if(G.noAnim){finishAnim();return}
 const ok=()=>ANIM.id===id,cap=t=>{const e=$("#cap");if(e)e.textContent=t};
 await wait(500);
 for(const e of ev){
  if(!ok())return;
  const sh=e.p,tg=1-e.p;
  if(e.kind=="shot"){
   const exs=e.ex.map(([r,c])=>cellEl(sh,r,c)).filter(Boolean);
   exs.forEach(x=>x.classList.add("fire"));
   cap(`${pn(sh)}的${NAME[e.t]}开火！${NAME[e.t]}暴露在 ${e.rv}`);sfx("fire"+e.t);
   await wait(1000);if(!ok())return;
   e.cells.map(([r,c])=>cellEl(tg,r,c)).filter(Boolean).forEach(x=>x.classList.add("imp"));
   cap(`炮弹落向 ${pn(tg)} 的阵地……`);
   await wait(600);if(!ok())return;
   e.cells.forEach(([r,c])=>{const x=cellEl(tg,r,c);if(!x)return;x.classList.remove("imp");
    if(e.waste.some(q=>q[0]==r&&q[1]==c))return;
    const h=e.hits.find(q=>q[0]==r&&q[1]==c);
    if(h){x.textContent="✕"+CH[h[2]];x.classList.add("boom")}else{if(!x.textContent)x.textContent="·";x.classList.add("dust")}});
   sfx(e.hits.length?"hit":"miss");
   cap(e.hits.length?`击毁 ${pn(tg)} 的 ${e.hits.map(h=>NAME[h[2]]+"（"+lab(h[0],h[1])+"）").join("、")}！`:"全部落空。");
   await wait(1100);if(!ok())return;
   exs.forEach(x=>x.classList.remove("fire"))}
  else if(e.kind=="bomb"){
   cap(`${pn(sh)}的轰炸机从 ${lab(e.start[0],e.start[1])} 起${DIRS[e.dir]}飞过 ${pn(tg)} 的阵地……`);sfx("bomb");
   for(const[r,c]of e.cells){if(!ok())return;const x=cellEl(tg,r,c);if(!x)continue;x.classList.add("blast","ember");
    const h=e.hits.find(q=>q[0]==r&&q[1]==c);if(h){x.textContent="✕"+CH[h[2]];sfx("hit")}else if(!x.textContent&&!G.ruin[tg][r][c])x.textContent="·";await wait(260)}
   cap(e.hits.length?`击毁 ${pn(tg)} 的 ${e.hits.map(h=>NAME[h[2]]+"（"+lab(h[0],h[1])+"）").join("、")}！`:"没有炸到炮。");
   await wait(2200);if(!ok())return}
  else if(e.kind=="missile"){
   const st=$("#stage");cap(`${pn(sh)}的陆军战术飞弹落下！以 ${lab(e.center[0],e.center[1])} 为中心 3×3……`);sfx("missile");
   await wait(1300);if(!ok())return;
   if(st)st.classList.add("sflash");
   const cs=[...e.cells].sort((a,b)=>(Math.abs(a[0]-e.center[0])+Math.abs(a[1]-e.center[1]))-(Math.abs(b[0]-e.center[0])+Math.abs(b[1]-e.center[1])));
   for(const[r,c]of cs){if(!ok())return;const x=cellEl(tg,r,c);if(!x)continue;const mid=r==e.center[0]&&c==e.center[1];x.classList.add("blast","ember");if(mid)x.classList.add("mega");
    const h=e.hits.find(q=>q[0]==r&&q[1]==c);x.textContent=h?"✕"+CH[h[2]]:"";if(h)sfx("hit");await wait(mid?420:180)}
   cap(e.hits.length?`击毁 ${pn(tg)} 的 ${e.hits.map(h=>NAME[h[2]]+"（"+lab(h[0],h[1])+"）").join("、")}！这九格成为永久废墟。`:"没有炸到炮，这九格成为永久废墟。");
   await wait(3000);if(!ok())return;
   e.cells.forEach(([r,c])=>{const x=cellEl(tg,r,c);if(x){x.classList.add("ruin");x.classList.remove("blast","mega","ember");x.textContent=""}});
   if(st)st.classList.remove("sflash");await wait(600);if(!ok())return}}
 if(ok())finishAnim()}

function act(a,el){
 const p=G.p,u=selUnit(),cpl=G.cp[p];
 if(a=="mute"){MUTE=!MUTE;if(G.ph=="result"){el.textContent=MUTE?"🔇 已静音":"🔊 音效开";return}return render()}

 if(extraAct(a,el))return;

 if(a=="rand"){G.units[p]=[];G.queue=[...Q];while(G.queue.length){const t=G.queue.shift();let r,c;do{r=Math.floor(Math.random()*R);c=Math.floor(Math.random()*C)}while(unitAt(p,r,c));G.units[p].push({id:++ID,t,r,c,alive:true,noFire:false,st:0,tgt:null,ammo:6,rs:0})}return render()}

 if(a=="go"){G.ph=G.next.ph;G.p=G.next.p;UI={sel:null,mode:null,cm:null,msg:""};return render()}
 if(a=="confirm"){if(planBlock())return;UI.cm=null;if(p==0&&G.mode=="cpu"){cpuPlan(1,G.diff);resolve()}else if(p==0){G.ph="pass";G.next={ph:"plan",p:1}}else resolve();return render()}
 if(a=="cont"){G.turn++;if(G.mode=="cpu"){G.ph="plan";G.p=0;UI={sel:null,mode:null,cm:null,msg:""}}else{G.ph="pass";G.next={ph:"plan",p:0}}return render()}
 if(a=="again"){init();return render()}
 /* 卡片 */
 if(a=="cuse"){const k=el.dataset.k;

function clickMine(r,c){

 if(G.ph=="setup"){

 if(UI.cm=="heli"||UI.cm=="carrier"){const x=cpl[UI.cm];

  x.r=r;x.c=c;UI.cm=null;return render()}
 if(UI.cm=="reinf"){const e=destFree(p,r,c);if(e)return flash(e);

/* ===== 新手教学 ===== */
function firstRun(){try{return !localStorage.getItem("tutSeen")}catch(e){return true}}
let TUT={page:0,z:null,exp:null,S:{}};
const TP=7,TGUN={M:{r:2,c:4,n:"迫击炮"},H:{r:1,c:4,n:"榴弹炮"},R:{r:4,c:4,n:"火箭炮"}};
const tutS=g=>TUT.S[g]||(TUT.S[g]={sel:false,mode:null,tgt:null,mv:null,lock:false,msg:""});
function tgrid(rev,fn){

function tutDone(){try{localStorage.setItem("tutSeen","1")}catch(e){}G.ph="start";render()}

function tutZones(){

 return`<h2>② 三个大区、六个小区</h2><p>你的阵地是 6 排 × 9 列。<b>按列分成三个大区</b>：红区（1–3 列）、绿区（4–6 列）、蓝区（7–9 列），每区 18 格。每个大区再<b>按排切成前、后</b>：<b>前 = A–C 排（靠近中线）</b>，<b>后 = D–F 排（远离中线）</b>，中间的虚线就是分界。所以一共 6 个小区，每个 9 格：红前、红后、绿前、绿后、蓝前、蓝后。</p><div class="mid">中线</div>${g}<p class="${z==null?"mut":""}">${z==null?"👆 点棋盘上任意一格试试，看它属于哪个小区。":"你点的小区是 <b>「"+SUBN[z]+"」</b>：<b>"+ZN[z>>1]+"区</b>（第 "+(3*(z>>1)+1)+"–"+(3*(z>>1)+3)+" 列）的<b>"+(z%2?"后":"前")+"</b>（"+(z%2?"D–F":"A–C")+" 排）。"}</p><div>${SUBN.map((n,i)=>`<button class="sm ${TUT.z===i?"main":""}" data-a="tz" data-i="${i}">${n}</button>`).join("")}</div><p class="mut">小区名字很重要：榴弹炮开火会被报出小区（例如“绿后”），侦察兵和无人机也以小区为单位。</p>`}

function tutGun(g){
 const gu=TGUN[g],S=tutS(g),u={t:g,r:gu.r,c:gu.c},lim=g=="R"?3:1;
 const steps={M:["点一下你棋盘上的「迫」，选中这门炮","按「开火」","在上方对手棋盘点一格当目标（有黄框的格子才够得着，射程 8）","（可选）按「移动 1 格」再点相邻的格子。注意：移动后下回合不能开火","按「确认本炮完成」锁定，锁定后不能再改"],
  H:["点一下你棋盘上的「榴」，选中这门炮","按「装填并锁定目标」","在上方对手棋盘点一格：它是 2×2 方块的左上角（射程 10）","按「确认本炮完成」锁定。下回合它自动发射，再下回合准备，之后才能再装填；榴弹炮不能移动"],
  R:["点一下你棋盘上的「火」，选中火箭炮","按「开火」","在上方对手棋盘点一格：它是十字 5 格的中心，全图都打得到","（可选）按「移动 ≤3 格」再点格子；对手不会被告知你往哪边移","按「确认本炮完成」锁定。弹药只有 6 发，少了要退到 E/F 排补弹"]}[g];
 const dn=g=="H"?[!!S.sel,!!(S.mode||S.tgt),!!S.tgt,S.lock]:[!!S.sel,!!(S.mode||S.tgt),!!S.tgt,!!(S.mv||S.lock),S.lock];
 let cur=dn.findIndex(x=>!x);if(cur<0)cur=dn.length;if(g!="H"&&S.tgt&&!S.mv&&!S.lock)cur=3;
 const enemy=tgrid(true,(r,c)=>{let cls="";
  if(S.tgt&&S.tgt.some(([a,b])=>a==r&&b==c))cls+=S.lock?" tgl":" tg";
  else if(S.sel&&(S.mode=="fire"||S.mode=="load")&&inRange(u,[[r,c]]))cls+=" rng";
  return{cls,d:`data-t="e" data-r="${r}" data-c="${c}"`}});
 const own=tgrid(false,(r,c)=>{let cls="",t="";
  if(r==gu.r&&c==gu.c){t=CH[g];if(S.sel)cls+=" sel";if(S.lock)cls+=" lk"}
  else if(S.mv&&S.mv[0]==r&&S.mv[1]==c){t="○";cls+=" tg"}
  else if(S.sel&&S.mode=="move"&&!S.lock&&Math.abs(r-gu.r)+Math.abs(c-gu.c)<=lim)cls+=" rng";
  return{cls,t,d:`data-t="m" data-r="${r}" data-c="${c}"`}});
 const b=(op,t,on)=>`<button data-a="tg" data-g="${g}" data-op="${op}" ${on&&!S.lock?"":"disabled"}>${t}</button>`;
 const btns=g=="M"?b("fire","开火",S.sel)+b("move","移动 1 格",S.sel):g=="H"?b("load","装填并锁定目标",S.sel):b("fire","开火",S.sel)+b("move","移动 ≤3 格",S.sel);
 return`<h2>${["③","④","⑤"]["MHR".indexOf(g)]} 操作${gu.n}（动手点一遍）</h2><div class="box">${steps.map((s,i)=>`<p>${dn[i]?"✅":i==cur?"👉":"⚪"} ${s}</p>`).join("")}</div><p class="mut">对手阵地（F 在上，A 靠中线）。距离 = 横差 + 纵差，按整张图算。</p>${enemy}<div class="mid">中线</div>${own}<p class="mut">我的阵地（A 靠中线）</p><div>${btns}<button class="main" data-a="tg" data-g="${g}" data-op="lock" ${S.tgt&&!S.lock?"":"disabled"}>确认本炮完成</button><button class="sm" data-a="tg" data-g="${g}" data-op="reset">重来</button></div><p class="${S.lock?"":"mut"}">${S.lock?"🎉 完成！所有的炮都锁定后，按「确认本回合」，双方同时结算。真正的对局里，对手的炮在哪里你并不知道，要靠暴露的线索去猜。":(S.msg||"")}</p>`}

function tutExpose(){

 const own=tgrid(false,(r,c)=>{let cls="",t="",tag="",tc="";
  if(g){const[gr,gc]=pos[g],z=Math.floor(gc/3);
   if(g=="M"&&c>=3*z&&c<=3*z+2){cls=" ex2";if(r==2&&c==3*z+1)tag="迫击炮在此区"}

   if(g=="R"&&r==gr&&c==gc){cls=" ex";tag="火箭炮"}
   if(r==gr&&c==gc)t=CH[g]}
  return{cls,t,tag}});
 const txt={M:"迫击炮从 C5 开火 → 对手被告知：<b>绿区</b>（整个大区 18 格）。精度最低。",H:"榴弹炮从 B5 开火 → 对手被告知：<b>绿前</b>（小区 9 格）。",R:"火箭炮从 E5 开火 → 对手被告知：<b>E5</b>（精确的一格）。最容易被抓到。"}[g];
 return`<h2>⑥ 开火会暴露位置</h2><p>你一开火，对手就会得到一条线索。炮的类型不同，暴露的精度也不同：<b>迫击炮报大区，榴弹炮报小区，火箭炮报精确格</b>。这条线索会一直保留在对手的棋盘上，直到那门炮被击毁，所以要想想：开火值不值得。</p><div>${["M","H","R"].map(x=>`<button class="${g==x?"main":""}" data-a="tx" data-g="${x}">${TGUN[x].n}开火</button>`).join("")}</div><p class="mut">下图是你的阵地，红色就是对手看到的暴露范围：</p>${own}<p>${g?txt:"👆 选一种炮看看它会暴露什么。"}</p>`}

function tutCards(){
 return`<h2>⑦ 卡片</h2><p>游戏里有 <b>11 张卡片</b>，开局双方就全部拥有。你只要记住三件事：</p><div class="box"><p>① 计划画面往下滑，有一个<b>「卡片」区</b>，每张卡都有一个<b>「使用」</b>按钮。</p><p>② 每张卡有<b>冷却或次数限制</b>，状态直接写在卡的旁边（例如“冷却中，还需 2 回合”），不用自己记。</p><p>③ <b>第 11 回合</b>有一张陆军战术飞弹是<b>强制使用</b>的，到时候画面会先要你选目标。</p></div><p>卡片有三种用途，各举一个例子：</p><div class="box"><p>🔍 <b>侦察兵</b>（情报）：指定一个小区，两回合后公布那 9 格里有什么。</p><p>🛡 <b>伪装网</b>（防守）：本回合挡掉对手的侦察、间谍、无人机、雷达。</p><p>💥 <b>轰炸机</b>（进攻）：选起点和方向，炸一条 6 格的线，格子里的炮全部击毁。</p></div><p class="mut">其余的卡在卡片区里都有一句话说明，边玩边看就行。</p>`}

function tutHTML(){
 const pg=TUT.page;let body;
 if(pg==0)body=`<h2>① 欢迎来到《毁灭弹道》</h2><p><b>目标：击毁对手所有的炮。</b>你守下半场，对手守上半场，中间是中线，大家都看不到对方的炮在哪。</p><p>每人开局有 6 门炮：<b>3 门迫击炮、2 门榴弹炮、1 门火箭炮</b>。每回合双方<b>同时、秘密</b>安排每门炮做什么，都按下确认后<b>一起结算</b>。20 回合到了还没分出胜负，就比谁剩的炮多。</p><div class="box"><p><b>迫 迫击炮</b>：射程 8，打 1 格。开火后可以移 1 格，但移动后下回合不能开火。</p><p><b>榴 榴弹炮</b>：射程 10，打 2×2。固定不能动，装填、发射、准备 3 回合一循环。</p><p><b>火 火箭炮</b>：全图射程，打十字 5 格。有 6 发弹药，开火后可移 3 格，要补弹得退到 E/F 排。</p></div><p class="mut">被击中的炮直接击毁，没有轻伤重伤。</p>`;
 else if(pg==1)body=tutZones();

function tutClick(el){
 const k=el.dataset.t,r=+el.dataset.r,c=+el.dataset.c,pg=TUT.page;
 if(k=="z"){TUT.z=subOf(r,c);sfx("tick");return render()}
 if(pg<2||pg>4)return;
 const g=["M","H","R"][pg-2],S=tutS(g),gu=TGUN[g],u={t:g,r:gu.r,c:gu.c},lim=g=="R"?3:1;
 if(S.lock)return;
 if(k=="m"){
  if(S.mode=="move"){if(r==gu.r&&c==gu.c)S.mv=null;else if(Math.abs(r-gu.r)+Math.abs(c-gu.c)>lim){S.msg="这门炮最多移动 "+lim+" 格。";return render()}else S.mv=[r,c];S.msg="";sfx("tick");return render()}
  if(r==gu.r&&c==gu.c){S.sel=true;S.msg="";sfx("sel"+g);return render()}
  S.msg="点你的炮（标着「"+CH[g]+"」的那一格）来选中它。";return render()}
 if(k=="e"){
  if(!S.sel){S.msg="先点自己棋盘上的炮选中它。";return render()}
  if(S.mode!="fire"&&S.mode!="load"){S.msg=g=="H"?"先按「装填并锁定目标」。":"先按「开火」。";return render()}
  const cs=cellsFor(u,r,c);
  if(!cs){S.msg="2×2 方块超出棋盘边缘，换个格子。";return render()}
  if(!inRange(u,cs)){S.msg="超出射程了，选有黄框的格子。";return render()}
  S.tgt=cs;S.msg="";sfx("tick");return render()}}

function extraAct(a,el){

  else if(op=="fire"||op=="load"||op=="move"){S.mode=op;S.msg=op=="move"?"点自己棋盘上的格子（高亮的就是能到的）。":"点上方对手棋盘选目标（有黄框的格子才够得着）。"}

 return false}

/* ===== 战争日志：回放（双方的炮全部公开） ===== */
let RP={frames:[],i:0,timer:null};
const who=p=>G.mode=="cpu"?(p==1?"电脑":"你"):"玩家 "+(p+1);
function buildFrames(){
 const F=[],cl=u=>u.map(a=>a.map(x=>({...x}))),ruin=[mkb(),mkb()];let bad=0;
 G.hist.forEach((rec,i)=>{
  let st=cl(rec.start);const T0=rec.t;
  const push=(text,hl)=>F.push({turn:T0,text,units:cl(st),ruin:cp2(ruin),hl:hl||{}});
  const rm=id=>{st=st.map(a=>a.filter(x=>x.id!=id))};
  const mv=(p,id,to)=>{const x=st[p].find(q=>q.id==id);if(x){x.r=to[0];x.c=to[1]}};
  push(i==0?"开局布阵：回放里双方的炮全部公开。":"回合开始。",{});
  rec.reinf.forEach(x=>{st[x.p].push({id:x.id,t:x.t,r:x.r,c:x.c});push(`${who(x.p)}使用<b>增援</b>：新迫击炮出现在 ${lab(x.r,x.c)}，当回合就能开火。`,{to:[[x.p,x.r,x.c]]})});
  rec.cards.forEach(x=>push(`${who(x.p)}${x.text}。`,{}));
  rec.trans.forEach(x=>{mv(x.p,x.id,x.to);push(`${who(x.p)}用<b>${CARDS[x.k]}</b>把迫击炮从 ${lab(...x.from)} 送到 ${lab(...x.to)}（当回合就到，本回合和下回合不能开火）。`,{from:[[x.p,...x.from]],to:[[x.p,...x.to]]})});
  const res=(e)=>e.hits.length?"击毁"+who(1-e.p)+"的"+e.hits.map(h=>NAME[h[2]]+"（"+lab(h[0],h[1])+"）").join("、"):"全部落空";
  rec.evs.forEach(e=>{
   if(e.kind=="shot")push(`${who(e.p)}的${NAME[e.t]}（${lab(...e.from)}）开火，暴露在 ${e.rv}：${res(e)}。`,{src:[[e.p,...e.from]],tgt:e.cells.map(x=>[1-e.p,...x]),hit:e.hits.map(h=>[1-e.p,h[0],h[1]])});
   else if(e.kind=="bomb")push(`${who(e.p)}的<b>轰炸机</b>从 ${lab(...e.start)} 起${DIRS[e.dir]}炸 ${e.cells.length} 格：${res(e)}。`,{tgt:e.cells.map(x=>[1-e.p,...x]),hit:e.hits.map(h=>[1-e.p,h[0],h[1]])});
   else{e.cells.forEach(([r,c])=>{ruin[1-e.p][r][c]=true});push(`${who(e.p)}的<b>陆军战术飞弹</b>命中以 ${lab(...e.center)} 为中心的 3×3：${res(e)}。这 9 格成为永久废墟。`,{tgt:e.cells.map(x=>[1-e.p,...x]),hit:e.hits.map(h=>[1-e.p,h[0],h[1]])})}});
  if(rec.dead.length){rec.dead.forEach(d=>rm(d.id));push("结算：被击毁 "+rec.dead.map(d=>who(d.p)+"的"+NAME[d.t]+"（"+lab(d.r,d.c)+"）").join("、")+"。",{hit:rec.dead.map(d=>[d.p,d.r,d.c])})}
  rec.moves.forEach(x=>{mv(x.p,x.id,x.to);push(`${who(x.p)}的${NAME[x.t]}从 ${lab(...x.from)} 移到 ${lab(...x.to)}。`,{from:[[x.p,...x.from]],to:[[x.p,...x.to]]})});
  rec.loads.forEach(x=>push(`${who(x.p)}的榴弹炮（${lab(...x.from)}）装填完毕，锁定目标 ${x.cells.map(c=>lab(...c)).join(" ")}，下回合发射。`,{src:[[x.p,...x.from]],tgt:x.cells.map(c=>[1-x.p,...c])}));
  rec.resups.forEach(x=>push(`${who(x.p)}的火箭炮（${lab(...x.at)}）开始补弹，要停 2 回合。`,{src:[[x.p,...x.at]]}));
  [0,1].forEach(p=>{rec.revs[p].forEach(t=>push(`【${who(p)}得到的情报】${t}`,{}));rec.inbox[p].forEach(t=>push(`【${who(p)}收到的通知】${t}`,{}))});
  const a=JSON.stringify(st.map(x=>x.map(y=>[y.id,y.r,y.c]).sort())),b=JSON.stringify(rec.end.map(x=>x.map(y=>[y.id,y.r,y.c]).sort()));if(a!==b)bad++;
  st=cl(rec.end);push(`回合结束。${who(0)}剩 ${st[0].length} 门炮，${who(1)}剩 ${st[1].length} 门炮。`,{})});
 const last=F[F.length-1];
 F.push({turn:last?last.turn:1,summary:true,text:summaryHTML(),units:last?last.units:[[],[]],ruin:last?last.ruin:[mkb(),mkb()],hl:{}});
 F.bad=bad;return F}
function summaryHTML(){

 const kills=p=>{const l=G.lost[1-p];return"击毁对手 "+(l.M+l.H+l.R)+" 门（迫击炮 "+l.M+"、榴弹炮 "+l.H+"、火箭炮 "+l.R+"）"};

 return`<p><b>${G.over||""}</b></p><p>一共打了 ${G.turn} 回合。</p>`+[0,1].map(p=>`<p><b>${who(p)}</b>：${kills(p)}；最后剩 ${cnt(p)}。<br>用过的卡：${cards(p)}。</p>`).join("")}
function rpBoard(p,f){

 const has=(k,r,c)=>(f.hl[k]||[]).some(x=>x[0]==p&&x[1]==r&&x[2]==c);
 let h=`<p class="mut">${fname(p)}（${p==1?"F 在上，A 靠中线":"A 靠中线"}）</p><div class="bd"><span></span>`+Array.from({length:C},(_,i)=>`<span class="lab">${i+1}</span>`).join("");
 rows.forEach(r=>{h+=`<span class="lab">${String.fromCharCode(65+r)}</span>`;for(let c=0;c<C;c++){
  const u=f.units[p].find(x=>x.r==r&&x.c==c);let cls="";
  if(f.ruin[p][r][c])cls+=" ruin";if(u)cls+=" u"+p;
  if(has("src",r,c))cls+=" hs";if(has("tgt",r,c))cls+=" ht";if(has("hit",r,c))cls+=" hh";if(has("from",r,c))cls+=" hf";if(has("to",r,c))cls+=" hto";
  h+=`<div class="cell z${Math.floor(c/3)}${cls}">${u?CH[u.t]:(has("from",r,c)?"○":"")}</div>`}});
 return h+"</div>"}
function rpStart(){RP.frames=buildFrames();RP.i=0;if(RP.timer){clearInterval(RP.timer);RP.timer=null}RP.playing=false;G.ph="replay";render()}
function replayHTML(){
 const turns=[...new Set(RP.frames.map(f=>f.turn))];
 return`<h2>战争日志（回放）</h2><p class="mut">双方的炮全部公开。蓝框 = ${who(0)}，红框 = ${who(1)}；橙色 = 开火的炮，黄色条纹 = 目标，红色 = 被击中，虚线 ○ = 移动前的位置，绿框 = 移动后的位置。</p><div id="rpBoards"></div><div class="box" id="rpText"></div><div><button data-a="rpprevT">⏮ 上回合</button><button data-a="rpprev">◀ 上一步</button><button class="main" id="rpPlayBtn" data-a="rpplay">▶ 播放</button><button data-a="rpnext">下一步 ▶</button><button data-a="rpnextT">下回合 ⏭</button></div><p><input type="range" id="rpSlider" min="0" max="${RP.frames.length-1}" value="0" data-a="rpslide" style="width:100%"></p><p>跳到：<select id="rpTurn" data-a="rpturn">${turns.map(t=>`<option value="${t}">第 ${t} 回合</option>`).join("")}<option value="end">总结</option></select></p><button data-a="rpexit">返回结算画面</button>`}
function rpUpdate(){
 const f=RP.frames[RP.i];if(!f)return;
 const b=$("#rpBoards"),t=$("#rpText"),s=$("#rpSlider"),sel=$("#rpTurn"),pb=$("#rpPlayBtn");
 if(b)b.innerHTML=rpBoard(1,f)+'<div class="mid">中线</div>'+rpBoard(0,f);
 if(t)t.innerHTML=(f.summary?"<b>总结</b>":`<b>第 ${f.turn} 回合</b>　<span class="mut">步骤 ${RP.i+1} / ${RP.frames.length}</span>`)+"<p>"+f.text+"</p>";
 if(s)s.value=RP.i;if(sel)sel.value=f.summary?"end":String(f.turn);
 if(pb)pb.textContent=RP.playing?"⏸ 暂停":"▶ 播放"}
function rpGo(i){RP.i=Math.max(0,Math.min(RP.frames.length-1,i));rpUpdate()}
function rpStop(){if(RP.timer){clearInterval(RP.timer);RP.timer=null}RP.playing=false}
function rpAct(a,el){
 if(a=="rpplay"){if(RP.playing){rpStop();rpUpdate();return}
  if(RP.i>=RP.frames.length-1)RP.i=0;RP.playing=true;RP.timer=setInterval(()=>{if(RP.i>=RP.frames.length-1){rpStop();rpUpdate();return}rpGo(RP.i+1)},1500);rpUpdate();return}
 if(a=="rpprev"){rpStop();rpGo(RP.i-1);return}
 if(a=="rpnext"){rpStop();rpGo(RP.i+1);return}
 if(a=="rpprevT"||a=="rpnextT"){rpStop();const f=RP.frames[RP.i],ts=[...new Set(RP.frames.map(x=>x.turn))],firstOf=t=>RP.frames.findIndex(x=>x.turn==t);
  if(a=="rpnextT"){const nt=f.summary?null:ts[ts.indexOf(f.turn)+1];RP.i=nt==null?RP.frames.length-1:firstOf(nt)}
  else if(f.summary||RP.i>firstOf(f.turn))RP.i=firstOf(f.turn);
  else RP.i=firstOf(ts[Math.max(0,ts.indexOf(f.turn)-1)]);
  rpUpdate();return}
 if(a=="rpexit"){rpStop();G.noAnim=true;G.ph="result";render();return}}
document.addEventListener("input",e=>{const t=e.target;if(t&&t.id=="rpSlider"){rpStop();rpGo(+t.value)}});
document.addEventListener("change",e=>{const t=e.target;if(t&&t.id=="rpTurn"){rpStop();const v=t.value;RP.i=v=="end"?RP.frames.length-1:RP.frames.findIndex(x=>x.turn==+v);rpUpdate()}});

/* ===== 电脑对手：只使用公开信息（对方开火时的暴露区域、我方射击的命中/落空结果、已击毁的炮种数、卡片情报） ===== */
function cpuSetup(p,d){
 G.units[p]=[];const used=new Set(),all=rg(0,C-1),cols=z=>rg(3*z,3*z+2);
 const put=(t,rs,cs)=>{let r,c,k=0;do{r=pick(rs);c=pick(cs);k++}while(used.has(r+","+c)&&k<500);used.add(r+","+c);G.units[p].push({id:++ID,t,r,c,alive:true,noFire:false,st:0,tgt:null,ammo:6,rs:0})};
 if(d==0)Q.forEach(t=>put(t,rg(0,5),all));
 else if(d==1)Q.forEach(t=>put(t,t=="M"?rg(0,3):t=="H"?rg(1,4):rg(3,5),all));
 else{const z=shuf([0,1,2]);put("H",rg(1,3),cols(z[0]));put("H",rg(1,3),cols(z[1]));put("R",rg(4,5),all);shuf([0,1,2]).forEach(k=>put("M",rg(0,2),cols(k)))}}

function aiHeat(p,d){
 const L=G.lost[1-p],rem={M:3-L.M,H:2-L.H,R:1-L.R},mk1=G.marks[p],now=G.turn,ex=G.seen[p],last=(a,n)=>n>0?a.slice(-n):[];
 const add=Array.from({length:R},()=>Array(C).fill(0)),zero=new Set();
 last(ex.filter(e=>e.t=="M"),rem.M).forEach(e=>{const w=3*Math.pow(.8,Math.max(0,now-e.turn-1));for(let r=0;r<R;r++)for(let c=e.c0;c<=e.c1;c++)add[r][c]+=w});
 const sk={},hs=[];ex.filter(e=>e.t=="H").forEach(e=>{const k=e.c0+","+e.r0;if(!sk[k]){sk[k]=1;hs.push(e)}});
 last(hs,rem.H).forEach(e=>{const cs=[];for(let r=e.r0;r<=e.r1;r++)for(let c=e.c0;c<=e.c1;c++)if(!mk1[r][c])cs.push([r,c]);
  const w=d==2?36/Math.max(1,cs.length):4;cs.forEach(([r,c])=>add[r][c]+=w)});
 last(ex.filter(e=>e.t=="R"),rem.R).forEach(e=>{const a=Math.max(0,now-e.turn-1),f=Math.pow(.6,a);add[e.r0][e.c0]+=5*f;
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const r=e.r0+dr,c=e.c0+dc;if(r>=0&&r<R&&c>=0&&c<C)add[r][c]+=2*f});
  if(d==2){const cs=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(Math.abs(r-e.r0)+Math.abs(c-e.c0)<=3)cs.push([r,c]);cs.forEach(([r,c])=>add[r][c]+=25*Math.pow(.75,a)/cs.length)}});
 /* 卡片情报：精确位置、小区、雷达推算、已知为空的格子 */
 G.rev[p].forEach(rv=>{
  (rv.items||[]).forEach(i=>{add[i.r][i.c]+=d==2?30:15});
  (rv.empties||[]).forEach(([r,c])=>zero.add(r+","+c));
  if(rv.kind=="drone"&&rv.area)rv.area.forEach(([r,c])=>add[r][c]+=d==2?3:1.5);
  if(rv.kind=="radar"&&rv.to)add[rv.to[0]][rv.to[1]]+=d==2?25:10});
 const nz=d==2?.12:.5;
 return add.map((row,r)=>row.map((a,c)=>{let v=1+a;const m=mk1[r][c];if(m=="#")v*=.03;else if(m=="x")v*=d==2?.35:.7;else if(m)v*=.3;if(zero.has(r+","+c))v*=.1;return Math.max(.01,v*(1+(Math.random()*2-1)*nz))}))}

function cpuPlan(p,d){
 const t=G.turn,o=1-p,P=G.plans[p]={},cp=G.cp[p]={};
 const h=d?aiHeat(p,d):null,pen=d==2?.15:.5,dests=new Set();
 const free=(r,c)=>!G.ruin[p][r][c]&&!G.units[p].some(x=>x.alive&&x.r==r&&x.c==c)&&!dests.has(r+","+c);
 const L=G.lost[o],eRem={M:Math.max(0,3-L.M),H:Math.max(0,2-L.H),R:Math.max(0,1-L.R)},eTot=eRem.M+eRem.H+eRem.R;
 const kn=known(p),knN=kn.M.length+kn.H.length+kn.R.length,ok=k=>!cardWhy(p,k);
 const sumHeat=cells=>cells.reduce((s,[a,b])=>s+(h?h[a][b]:1),0);
 const notRuin=cells=>cells.filter(([a,b])=>!G.ruin[o][a][b]);
 /* 第 11 回合：强制陆军战术飞弹 */
 if(t==11&&ok("missile")){let best={r:rnd(R),c:rnd(C)};
  if(h){let bs=-1;for(let r=0;r<R;r++)for(let c=0;c<C;c++){const s=sumHeat(notRuin(blk3({r,c})))*(1+Math.random()*.001);if(s>bs){bs=s;best={r,c}}}}
  cp.missile=best;if(h)blk3(best).forEach(([a,b])=>h[a][b]*=pen)}
 /* 增援：原来的迫击炮全毁后立刻用 */
 if(ok("reinf")){let cs=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(free(r,c)&&(d==0||r<=3))cs.push([r,c]);
  if(!cs.length)for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(free(r,c))cs.push([r,c]);
  if(cs.length){const[r,c]=pick(cs),nu={id:++ID,t:"M",r,c,alive:true,noFire:false,st:0,tgt:null,ammo:6,rs:0};G.units[p].push(nu);cp.reinf={id:nu.id}}}
 /* 直升机：把被暴露的迫击炮送到没被暴露的大区 */
 let tr=null;
 if(d>0&&ok("heli")){const kz=known(o).M,mz=G.units[p].filter(u=>u.alive&&u.t=="M"&&kz.some(e=>u.c>=e.c0&&u.c<=e.c1));
  if(mz.length&&Math.random()<[0,.35,.7][d]){const u=pick(mz);let cs=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(free(r,c)&&!kz.some(e=>c>=e.c0&&c<=e.c1))cs.push([r,c]);
   if(!cs.length)for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(free(r,c))cs.push([r,c]);
   if(cs.length){const[r,c]=pick(cs);cp.heli={id:u.id,r,c};dests.add(r+","+c);tr=u}}}
 /* 情报与防守类卡片 */
 if(ok("scout")){let use=false,zi=rnd(6);
  if(!h)use=Math.random()<.12;
  else{let bs=-1;SUBN.forEach((_,i)=>{const s=sumHeat(subCells(i));if(s>bs){bs=s;zi=i}});use=d==2||Math.random()<.6}
  if(use)cp.scout=zi}
 if(ok("spy")){const u=d==0?Math.random()<.08:d==1?(eTot-knN>=3&&Math.random()<.5):(eTot<=2||(t>=8&&knN<=1));if(u)cp.spy=true}
 if(ok("drone")&&eRem.M>0){const u=d==0?Math.random()<.1:d==1?(kn.M.length>0&&Math.random()<.5):true;if(u)cp.drone=true}
 if(ok("camo")){const u=d==0?false:d==1?Math.random()<.2:(t>=4&&Math.random()<.3);if(u)cp.camo=true}
 if(ok("radar")&&eRem.R>0){const u=d==0?(t==20&&Math.random()<.5):d==1?t==19:t==18;if(u)cp.radar=true}
 if(ok("sat")){const u=d==0?(t==20&&Math.random()<.5):d==1?Math.random()<.5:t==19;if(u)cp.sat=true}
 /* 轰炸机 */
 if(ok("bomb")){let best=null,bs=-1;
  if(!h){if(Math.random()<.25)best={r:rnd(R),c:rnd(C),d:pick(Object.keys(DIRV))}}
  else{for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const dd of Object.keys(DIRV)){const s=sumHeat(notRuin(lineCells({r,c,d:dd})))*(1+Math.random()*.001);if(s>bs){bs=s;best={r,c,d:dd}}}
   if(!(bs>=(d==2?9:8)||t>=7))best=null;if(d==1&&Math.random()<.2)best=null}
  if(best){cp.bomb=best;if(h)lineCells(best).forEach(([a,b])=>h[a][b]*=pen)}}
 /* 炮：开火与移动 */
 const mine=G.units[p].filter(u=>u.alive);
 const occ=(r,c,s)=>G.ruin[p][r][c]||mine.some(x=>x!==s&&x.r==r&&x.c==c)||dests.has(r+","+c);
 const moves=(u,lim)=>{const o2=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++){const k=Math.abs(r-u.r)+Math.abs(c-u.c);if(k>0&&k<=lim&&!occ(r,c,u))o2.push([r,c,k])}return o2};
 const amin=(a,f)=>{let b=null,bv=1e9;a.forEach(x=>{const v=f(x);if(v<bv){bv=v;b=x}});return b};
 const go=(pl,q)=>{pl.move=[q[0],q[1]];dests.add(q[0]+","+q[1])};
 const choose=u=>{
  if(!h){const o2=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++){const cs=cellsFor(u,r,c);if(cs&&inRange(u,cs))o2.push(cs)}return o2.length?pick(o2):null}
  let bs=-1,bc=null;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const cs=cellsFor(u,r,c);if(!cs||!inRange(u,cs))continue;const s=cs.reduce((x,[a,b])=>x+h[a][b],0);if(s>bs){bs=s;bc=cs}}
  if(bc)bc.forEach(([a,b])=>h[a][b]*=pen);return bc};
 if(h)mine.forEach(u=>{if(u.t=="H"&&u.st==1)u.tgt.forEach(([a,b])=>h[a][b]*=pen)});
 [...mine].sort((a,b)=>"RHM".indexOf(a.t)-"RHM".indexOf(b.t)).forEach(u=>{const pl=P[u.id]={};
  if(u===tr){pl.lock=true;return}
  if(u.t=="H"){if(u.st==0){const cs=choose(u);if(cs)pl.load=cs}}
  else if(u.t=="M"){
   if(!u.noFire){const cs=choose(u);if(cs)pl.fire=cs}
   if(pl.fire&&Math.random()<[.5,.25,.15][d]){const m=moves(u,1);if(m.length)go(pl,pick(m))}}
  else if(!u.rs){
   const need=u.ammo<=[0,1,2][d];
   if(need&&u.r>=4&&u.ammo<4)pl.resup=true;
   else{
    if(u.ammo>0){const cs=choose(u);if(cs)pl.fire=cs}
    if(need&&u.r<4){const q=amin(moves(u,3),m=>Math.max(0,4-m[0])*3+Math.random()*.3);if(q)go(pl,q)}
    else if(pl.fire&&(d>0||Math.random()<.3)){const q=amin(moves(u,3),m=>-m[2]+(d==2?Math.abs(m[0]-4.5)*.15:0)+Math.random()*(d==2?1.2:2));if(q)go(pl,q)}}}
  pl.lock=true})}


init();if(firstRun())G.ph="tut";render();
</script>
