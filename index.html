<style>

</style>

<script>
const R=6,C=9,NAME={M:"迫擊砲",H:"榴彈砲",R:"火箭砲",G:"將軍"},CH={M:"迫",H:"榴",R:"火",G:"將"},MAXR={M:8,H:10,R:99},ZN=["紅","綠","藍"],Q=["M","M","M","H","H","R"],QG=[...Q,"G"];
const SUBN=["紅前","紅後","綠前","綠後","藍前","藍後"];
const subOf=(r,c)=>Math.floor(c/3)*2+(r>=3?1:0);
const subCells=i=>{const z=i>>1,r0=i%2?3:0,o=[];for(let r=r0;r<r0+3;r++)for(let c=3*z;c<3*z+3;c++)o.push([r,c]);return o};
const CARDS={scout:"偵察兵",spy:"間諜",radar:"雷達",drone:"無人機",camo:"偽裝網",sat:"紅外線衛星",bomb:"轟炸機",heli:"直升機",carrier:"運兵車",reinf:"增援",missile:"陸軍戰術飛彈"};
const CORDER=["scout","spy","radar","drone","camo","sat","bomb","heli","carrier","reinf","missile"];
const DESC={scout:"指定一個小區，下下回合公布那 9 格有什麼；冷卻 3 回合",spy:"隨機暴露對手一門砲的精確格；整局 1 次",radar:"第 18–20 回合：對手火箭砲開火那回合，顯示它移動的方向和格數；整局 1 次",drone:"隨機查出對手一門迫擊砲所在的小區，當回合結算；冷卻 3 回合",camo:"本回合擋掉對手的偵察兵、間諜、無人機、雷達；整局 2 次，隔一回合可再用",sat:"第 19–20 回合：顯示對手所有砲的精確位置，擋不住；整局 1 次",bomb:"選起點和方向，炸一條 6 格的線；冷卻 10 回合",heli:"把一門迫擊砲或將軍送到己方任意空格；迫擊砲本回合和下回合不能開火；冷卻 5 回合",carrier:"同直升機，但只能在同一顏色大區內；冷卻 5 回合",reinf:"原來 3 門迫擊砲全毀後，第 1–10 回合內增加 1 門迫擊砲；整局 1 次",missile:"第 11 回合強制：炸 3×3，那 9 格成為永久廢墟"};
const msT=t=>G.easy?(t%3==0&&t<=18):t==11;
const cnt0=o=>({M:3,H:2,R:G.easy&&o==0?2:1});
const qFor=p=>G.easy&&p==0?[...Q,"R","G"]:[...QG];
const EDESC={scout:"指定一個小區，下下回合公布那 9 格有什麼；用一次要休息 1 回合",bomb:"選起點和方向，炸一條 6 格的線；沒有冷卻，每回合都能放",radar:"第 4 回合起：對手火箭砲開火那回合，顯示它移動的方向和格數；整局 1 次",sat:"第 4 回合起：顯示對手所有砲的精確位置，擋不住；整局 1 次",heli:"把一門迫擊砲或將軍送到己方任意空格；沒有冷卻",carrier:"同直升機，但只能在同一顏色大區內；沒有冷卻",missile:"第 3、6、9、12、15、18 回合強制：自己選位置，炸 3×3，那 9 格成為永久廢墟"};
const descOf=k=>G.easy&&EDESC[k]?EDESC[k]:DESC[k];
const DIRV={U:[1,0],D:[-1,0],L:[0,-1],R:[0,1]},DIRS={U:"往上",D:"往下",L:"往左",R:"往右"};
const $=s=>document.querySelector(s);
const lab=(r,c)=>String.fromCharCode(65+r)+(c+1);
let G,UI,ID=0,AC=null,MUTE=false;
const mk=()=>Array.from({length:R},()=>Array(C).fill(""));
const mkn=()=>Array.from({length:R},()=>Array(C).fill(0));
const mkb=()=>Array.from({length:R},()=>Array(C).fill(false));
const newCards=()=>({scout:-99,drone:-99,camo:-99,bomb:-99,heli:-99,carrier:-99,camoN:0,spy:false,radar:false,sat:false,reinf:false,missile:false});
const cp2=a=>a.map(m=>m.map(r=>[...r]));
const left=()=>G.units[G.p].filter(u=>u.alive&&!(G.plans[G.p][u.id]||{}).lock).length;
const own=u=>G.units[0].includes(u)?0:1;
const adjGen=u=>{const p=own(u);return G.units[p].some(x=>x.alive&&x.t=="G"&&Math.abs(x.r-u.r)+Math.abs(x.c-u.c)==1)};
const canFire=u=>!u.tr&&(!u.noFire||adjGen(u));
const canLoad=u=>u.st==0||(u.st==2&&adjGen(u));
const hearts=n=>"♥".repeat(Math.max(0,n))+"♡".repeat(Math.max(0,5-n));
const lineCells=b=>{const[dr,dc]=DIRV[b.d],o=[];for(let i=0;i<6;i++){const r=b.r+dr*i,c=b.c+dc*i;if(r>=0&&r<R&&c>=0&&c<C)o.push([r,c])}return o};
const blk3=m=>{const o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const r=m.r+dr,c=m.c+dc;if(r>=0&&r<R&&c>=0&&c<C)o.push([r,c])}return o};
const mshow=(m,xt,turn)=>m=="x"?(turn-xt<=3?"·":""):m=="g"?(turn-xt<=3?"♥":""):(m=="#"||!m)?"":"✕"+CH[m];

/* ===== 聲音（瀏覽器合成） ===== */
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=="suspended")AC.resume();return AC}
function tone(f,d,type,v,t0,f2){const a=ac();if(!a||MUTE)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(t0||0);o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}

/* ===== 已知對手位置（開火暴露標記，保留到那門砲被擊毀） ===== */
function known(p){
 const L=G.lost[1-p],c0=cnt0(1-p),rem={M:c0.M-L.M,H:c0.H-L.H,R:c0.R-L.R},ex=G.seen[p],last=(a,n)=>n>0?a.slice(-n):[];
 const dd=(arr,key)=>{const m=new Map();arr.forEach(e=>{const k=key(e);m.delete(k);m.set(k,e)});return[...m.values()]};
 return{M:last(dd(ex.filter(e=>e.t=="M"),e=>e.c0),rem.M),H:last(dd(ex.filter(e=>e.t=="H"),e=>e.c0+","+e.r0),rem.H),R:last(ex.filter(e=>e.t=="R"),rem.R)}}
function markers(p,exm,tagm){
 const K=known(p),age=e=>G.turn-e.turn,old=e=>age(e)>1?"（"+(age(e)-1)+" 回合前）":"";
 const add=(k,v)=>tagm.set(k,tagm.has(k)?{txt:tagm.get(k).txt+" / "+v,cls:tagm.get(k).cls}:{txt:v,cls:""});
 const paint=e=>{for(let r=e.r0;r<=e.r1;r++)for(let c=e.c0;c<=e.c1;c++){const k=r+","+c;if(age(e)<=1)exm.set(k,"ex");else if(!exm.has(k))exm.set(k,"ex2")}};
 K.M.forEach(e=>{paint(e);add(2+","+(e.c0+1),"迫擊砲在此區"+old(e))});
 K.H.forEach(e=>{paint(e);add((e.r0+1)+","+(e.c0+1),"榴彈砲在此區")});
 K.R.forEach(e=>{paint(e);add(e.r0+","+e.c0,"火箭砲"+old(e))})}
/* 卡片情報（偵察、間諜、無人機、衛星）只顯示一回合 */
function revealsOn(p,scan,tagm){
 G.rev[p].forEach(rv=>{(rv.area||[]).forEach(([r,c])=>scan.add(r+","+c));
  (rv.tags||[]).forEach(t=>{const k=t.r+","+t.c;tagm.set(k,tagm.has(k)?{txt:tagm.get(k).txt+" / "+t.txt,cls:t.cls}:{txt:t.txt,cls:t.cls})})})}

function board(b){

 const u=selUnit(),pls=G.plans[p],cp=G.cp[p],tg=new Set(),tgl=new Set(),mv=new Set(),ex=new Map(),tagm=new Map(),scan=new Set();
 G.units[p].forEach(x=>{if(x.alive&&x.st==1&&x.tgt)x.tgt.forEach(([r,c])=>tgl.add(r+","+c))});
 Object.values(pls).forEach(x=>{(x.fire||x.load||[]).forEach(([r,c])=>(x.lock?tgl:tg).add(r+","+c));if(x.move)mv.add(x.move[0]+","+x.move[1])});
 if(cp.scout!==undefined)subCells(cp.scout).forEach(([r,c])=>tg.add(r+","+c));
 if(cp.bomb&&cp.bomb.r!=null)lineCells(cp.bomb).forEach(([r,c])=>tg.add(r+","+c));
 if(cp.missile)blk3(cp.missile).forEach(([r,c])=>tg.add(r+","+c));
 ["heli","carrier"].forEach(k=>{if(cp[k]&&cp[k].r!=null)mv.add(cp[k].r+","+cp[k].c)});
 if(b=="e"){markers(p,ex,tagm);revealsOn(p,scan,tagm)}
 const ow=b=="m"?p:1-p,gn=b=="m"?G.units[p].find(x=>x.alive&&x.t=="G"):null;
 let h=`<div class="bd"><span class="lab">${b=="e"?"敵":"我"}</span>`+Array.from({length:C},(_,i)=>`<span class="lab">${i+1}</span>`).join("");
 rows.forEach(r=>{h+=`<span class="lab">${String.fromCharCode(65+r)}</span>`;
  for(let c=0;c<C;c++){let t="",cls="";const k=r+","+c;
   if(G.ruin[ow][r][c])cls+=" ruin";
   if(gn&&Math.abs(gn.r-r)+Math.abs(gn.c-c)==1)cls+=" aura";
   if(b=="m"){const x=unitAt(p,r,c);if(x){t=CH[x.t];if(x.t=="G")cls+=" gen";if(G.spot[p].includes(x.id))cls+=" spot";if(x.id==UI.sel)cls+=" sel";if(G.ph=="plan"){const q=G.plans[p][x.id]||{};cls+=q.lock?" lk":Object.keys(q).length?" pl":""}}else if(mv.has(k)){t="○";cls+=" tg"}}
   else{t=mshow(G.marks[p][r][c],G.xt[p][r][c],G.turn);if(scan.has(k))cls+=" scan";if(ex.has(k))cls+=" "+ex.get(k);if(tgl.has(k))cls+=" tgl";else if(tg.has(k))cls+=" tg";
    if(u&&(UI.mode=="fire"||UI.mode=="load")){const cs=cellsFor(u,r,c);if(cs&&inRange(u,[[r,c]]))cls+=" rng"}}
   const tgm=tagm.get(k);
   h+=`<div class="cell z${Math.floor(c/3)}${cls}" data-b="${b}" data-r="${r}" data-c="${c}">${t}${tgm?`<span class="tag ${tgm.cls}">${tgm.txt}</span>`:""}</div>`}});
 return h+"</div>"}

async function startAnim(){
 const id=++ANIM.id,ev=G.events||[];if(!ev.length)return;if(G.noAnim){finishAnim();return}
 const ok=()=>ANIM.id===id,cap=t=>{const e=$("#cap");if(e)e.textContent=t};
 await wait(500);
 for(const e of ev){
  if(!ok())return;
  const sh=e.p,tg=1-e.p;
  if(e.kind=="shot"){
   const exs=e.ex.map(([r,c])=>cellEl(sh,r,c)).filter(Boolean);
   exs.forEach(x=>x.classList.add("fire"));
   cap(`${pn(sh)}的${NAME[e.t]}開火！${NAME[e.t]}暴露在 ${e.rv}`);sfx("fire"+e.t);
   await wait(1000);if(!ok())return;
   e.cells.map(([r,c])=>cellEl(tg,r,c)).filter(Boolean).forEach(x=>x.classList.add("imp"));
   cap(`砲彈落向 ${pn(tg)} 的陣地……`);
   await wait(600);if(!ok())return;
   e.cells.forEach(([r,c])=>{const x=cellEl(tg,r,c);if(!x)return;x.classList.remove("imp");
    if(e.waste.some(q=>q[0]==r&&q[1]==c))return;
    const h=e.hits.find(q=>q[0]==r&&q[1]==c);
    if(h){x.textContent="✕"+CH[h[2]];x.classList.add("boom")}else if(e.gh.some(q=>q[0]==r&&q[1]==c)){x.textContent="♥";x.classList.add("boom")}else{if(!x.textContent)x.textContent="·";x.classList.add("dust")}});
   sfx(e.hits.length||e.gh.length?"hit":"miss");
   cap((e.hits.length?`擊毀 ${pn(tg)} 的 ${e.hits.map(h=>NAME[h[2]]+"（"+lab(h[0],h[1])+"）").join("、")}！`:"")+(e.gh.length?`命中將軍！剩 ${Math.min(...e.gh.map(g=>g[2]))} 顆愛心。`:"")||"全部落空。");
   await wait(1100);if(!ok())return;
   exs.forEach(x=>x.classList.remove("fire"))}
  else if(e.kind=="bomb"){
   cap(`${pn(sh)}的轟炸機從 ${lab(e.start[0],e.start[1])} 起${DIRS[e.dir]}飛過 ${pn(tg)} 的陣地……`);sfx("bomb");
   for(const[r,c]of e.cells){if(!ok())return;const x=cellEl(tg,r,c);if(!x)continue;x.classList.add("blast","ember");
    const h=e.hits.find(q=>q[0]==r&&q[1]==c);if(h){x.textContent="✕"+CH[h[2]];sfx("hit")}else if(e.gh.some(q=>q[0]==r&&q[1]==c)){x.textContent="♥";sfx("hit")}else if(!x.textContent&&!G.ruin[tg][r][c])x.textContent="·";await wait(260)}
   cap((e.hits.length?`擊毀 ${pn(tg)} 的 ${e.hits.map(h=>NAME[h[2]]+"（"+lab(h[0],h[1])+"）").join("、")}！`:"")+(e.gh.length?`命中將軍！剩 ${Math.min(...e.gh.map(g=>g[2]))} 顆愛心。`:"")||"沒有炸到砲。");
   await wait(2200);if(!ok())return}
  else if(e.kind=="missile"){
   const st=$("#stage");cap(`${pn(sh)}的陸軍戰術飛彈落下！以 ${lab(e.center[0],e.center[1])} 為中心 3×3……`);sfx("missile");
   await wait(1300);if(!ok())return;
   if(st)st.classList.add("sflash");
   const cs=[...e.cells].sort((a,b)=>(Math.abs(a[0]-e.center[0])+Math.abs(a[1]-e.center[1]))-(Math.abs(b[0]-e.center[0])+Math.abs(b[1]-e.center[1])));
   for(const[r,c]of cs){if(!ok())return;const x=cellEl(tg,r,c);if(!x)continue;const mid=r==e.center[0]&&c==e.center[1];x.classList.add("blast","ember");if(mid)x.classList.add("mega");
    const h=e.hits.find(q=>q[0]==r&&q[1]==c);x.textContent=h?"✕"+CH[h[2]]:"";if(h)sfx("hit");await wait(mid?420:180)}
   cap(e.hits.length?`擊毀 ${pn(tg)} 的 ${e.hits.map(h=>NAME[h[2]]+"（"+lab(h[0],h[1])+"）").join("、")}！這九格成為永久廢墟。`:"沒有炸到砲，這九格成為永久廢墟。");
   await wait(3000);if(!ok())return;
   e.cells.forEach(([r,c])=>{const x=cellEl(tg,r,c);if(x){x.classList.add("ruin");x.classList.remove("blast","mega","ember");x.textContent=""}});
   if(st)st.classList.remove("sflash");await wait(600);if(!ok())return}}
 if(ok())finishAnim()}

 if(a=="start"){G.mode=el.dataset.m;G.diff=+el.dataset.d||0;G.easy=!!el.dataset.e;G.queue=qFor(0);G.ph="setup";G.p=0;return render()}

 if(a=="done"){if(G.queue.length)return;if(G.mode=="cpu"){cpuSetup(1,G.diff);G.ph="plan";G.p=0;UI={sel:null,mode:null,cm:null,msg:"",sheet:null};return render()}G.ph="pass";G.next=p==0?{ph:"setup",p:1}:{ph:"plan",p:0};if(p==0)G.queue=[...QG];return render()}
 if(a=="go"){G.ph=G.next.ph;G.p=G.next.p;UI={sel:null,mode:null,cm:null,msg:"",sheet:null};return render()}
 if(a=="confirm"){if(planBlock())return;UI.cm=null;UI.sheet=null;if(p==0&&G.mode=="cpu"){cpuPlan(1,G.diff);resolve()}else if(p==0){G.ph="pass";G.next={ph:"plan",p:1}}else resolve();return render()}
 if(a=="cont"){G.turn++;UI.sheet=null;if(G.mode=="cpu"){G.ph="plan";G.p=0;UI={sel:null,mode:null,cm:null,msg:"",sheet:null}}else{G.ph="pass";G.next={ph:"plan",p:0}}return render()}
 if(a=="surok"){init();UI.sheet=null;return render()}

  else if(k=="missile"){UI.cm="missile";UI.sheet=null}

 if(a=="ccancel"){const k=el.dataset.k;
  if(k=="reinf"&&cpl.reinf){G.units[p]=G.units[p].filter(x=>x.id!=cpl.reinf.id);delete G.plans[p][cpl.reinf.id];if(UI.sel==cpl.reinf.id)UI.sel=null}

function clickMine(r,c){
 const p=G.p,hit=unitAt(p,r,c);
 if(G.ph=="setup"){
  if(hit){G.units[p]=G.units[p].filter(x=>x!==hit);G.queue.unshift(hit.t)}
  else if(G.queue.length){G.units[p].push({id:++ID,t:G.queue.shift(),r,c,alive:true,noFire:false,st:0,tgt:null,ammo:6,rs:0,hp:5})}
  return render()}
 const cpl=G.cp[p];
 if(msT(G.turn)&&!cpl.missile)return flash("第 "+G.turn+" 回合：先鎖定陸軍戰術飛彈的目標。");
 if(UI.cm=="heli"||UI.cm=="carrier"){const x=cpl[UI.cm];
  if(hit){if(hit.t!="M"&&hit.t!="G")return flash("運輸卡只能運迫擊砲或將軍。");x.id=hit.id;x.r=null;x.c=null;delete G.plans[p][hit.id];return render()}
  if(x.id==null)return flash("先點選要運送的迫擊砲。");
  const mu=G.units[p].find(q=>q.id==x.id),e=destFree(p,r,c);if(e)return flash(e);
  if(UI.cm=="carrier"&&Math.floor(c/3)!=Math.floor(mu.c/3))return flash("運兵車只能在同一個顏色大區內運送。");
  x.r=r;x.c=c;UI.cm=null;return render()}
 if(UI.cm=="reinf"){const e=destFree(p,r,c);if(e)return flash(e);
  const nu={id:++ID,t:"M",r,c,alive:true,noFire:false,st:0,tgt:null,ammo:6,rs:0,hp:5};G.units[p].push(nu);cpl.reinf={id:nu.id};UI.cm=null;UI.sel=nu.id;return render()}
 const u=selUnit();
 if(UI.mode=="move"&&u){if((G.plans[p][u.id]||{}).lock)return flash("這門砲已鎖定，不能再修改。");
  if(G.ruin[p][r][c])return flash("那裡是廢墟，砲不能進入。");
  if(hit&&hit!==u)return flash("那一格已有砲。");
  const d=Math.abs(u.r-r)+Math.abs(u.c-c),lim=u.t=="R"?3:u.t=="G"?2:1;
  if(d>lim)return flash("這門砲最多移動 "+lim+" 格。");
  if(Object.entries(G.plans[p]).some(([id,x])=>+id!==u.id&&x.move&&x.move[0]==r&&x.move[1]==c)||["heli","carrier"].some(k=>cpl[k]&&cpl[k].r==r&&cpl[k].c==c))return flash("已有別的砲要移到那裡。");
  const pl=plan(u);if(d==0)delete pl.move;else pl.move=[r,c];return render()}
 if(hit){UI.sel=hit.id;UI.mode=null;UI.cm=null;sfx("sel"+hit.t);render()}}

 if(UI.cm=="bomb"&&cpl.bomb){cpl.bomb.r=r;cpl.bomb.c=c;sfx("tick");return render()}

  H:["點一下你陣地上的「榴」，選中這門砲","按「裝填並鎖定目標」","點上方對手陣地的一格：它是 2×2 方塊的左上角（射程 10）","按「確認本砲完成」鎖定。下回合自動發射，再下回合準備，之後才能再裝填；榴彈砲不能移動"],

 const dn=g=="H"?[!!S.sel,!!(S.mode||S.tgt),!!S.tgt,S.lock]:[!!S.sel,!!(S.mode||S.tgt),!!S.tgt,!!(S.mv||S.lock),S.lock];
 let cur=dn.findIndex(x=>!x);if(cur<0)cur=dn.length;if(g!="H"&&S.tgt&&!S.mv&&!S.lock)cur=3;
 const enemy=tgrid(true,(r,c)=>{let cls="";

 const own=tgrid(false,(r,c)=>{let cls="",t="";
  if(r==gu.r&&c==gu.c){t=CH[g];if(S.sel)cls+=" sel";if(S.lock)cls+=" lk"}
  else if(S.mv&&S.mv[0]==r&&S.mv[1]==c){t="○";cls+=" tg"}
  else if(S.sel&&S.mode=="move"&&!S.lock&&Math.abs(r-gu.r)+Math.abs(c-gu.c)<=lim)cls+=" rng";
  return{cls,t,d:`data-t="m" data-r="${r}" data-c="${c}"`}},"我");
 const b=(op,t,on)=>`<button class="sm" data-a="tg" data-g="${g}" data-op="${op}" ${on&&!S.lock?"":"disabled"}>${t}</button>`;
 const btns=g=="M"?b("fire","開火",S.sel)+b("move","移動 1 格",S.sel):g=="H"?b("load","裝填並鎖定目標",S.sel):b("fire","開火",S.sel)+b("move","移動 ≤3 格",S.sel);
 const no=["③","④","⑤"]["MHR".indexOf(g)],prog=dn.map((x,i)=>x?"✅":i==cur?"👉":"⚪").join("");
 return{nb:2,txt:`<h2 style="margin:0 0 2px">${no} 操作${gu.n}（動手點一遍）</h2><p style="margin:2px 0">${prog}　${S.lock?"🎉 <b>完成！</b>所有砲都鎖定後按「確認本回合」，雙方同時結算。真正對局時，你不知道對手的砲在哪，要靠暴露的線索去猜。":"<b>第 "+(cur+1)+" 步</b>："+steps[Math.min(cur,steps.length-1)]}</p>${S.msg?`<p class="warn" style="margin:2px 0">${S.msg}</p>`:""}`,boards:`<div class="tbd">${enemy}<div class="mid">中線</div>${own}</div>`,ctl:btns+`<button class="sm main" data-a="tg" data-g="${g}" data-op="lock" ${S.tgt&&!S.lock?"":"disabled"}>確認本砲完成</button><button class="sm" data-a="tg" data-g="${g}" data-op="reset">重來</button>`}}

function tutParts(){

 if(pg==0)return{scroll:true,txt:`<h2 style="margin:0 0 4px">① 先認識遊戲</h2><p><b>目標：擊毀對手所有的砲，或打光他將軍的 5 顆愛心。</b>你守下半場，對手守上半場，中間是中線，雙方都看不到對方的砲在哪。</p><p>每人開局有 6 門砲：<b>3 門迫擊砲、2 門榴彈砲、1 門火箭砲</b>，另外還有一位不能攻擊的<b>將軍</b>（第 6 頁說明）。每回合雙方<b>同時、秘密</b>安排每門砲做什麼，都按下確認後<b>一起結算</b>。20 回合到了沒分出勝負，就比誰剩的砲多。被擊中的砲直接擊毀。</p><div class="box"><p><b>迫 迫擊砲</b>：射程 8，打 1 格。開火後可移 1 格，但移動後下回合不能開火。</p><p><b>榴 榴彈砲</b>：射程 10，打 2×2。固定不能動，裝填、發射、準備 3 回合一循環。</p><p><b>火 火箭砲</b>：全圖射程，打十字 5 格。有 6 發彈藥，開火後可移 3 格，要補彈得退到 E/F 排。</p></div>`};

 if(pg==5)return{scroll:true,txt:`<h2 style="margin:0 0 4px">⑥ 將軍</h2><p>除了 6 門砲，你還有一位<b style="color:#ffd23a">金色的「將」</b>。他<b>沒有攻擊力</b>，但關係到輸贏：</p><div class="box"><p>❤ 有 <b>5 顆愛心</b>（畫面上方會顯示雙方的愛心）。每一發<b>不同的攻擊</b>打中他所在的格子，就扣 1 顆；同一發攻擊掃到幾格都只算 1 顆。</p><p>☠ 愛心歸零，或被<b>陸軍戰術飛彈</b>打中，將軍就陣亡，<b>你直接輸</b>。</p><p>🏃 每回合可以移動 <b>2 格</b>（點他，按「移動」，再按「待命」鎖定），也能搭直升機、運兵車。</p></div><p><b>站位有加成</b>：上下左右<b>相鄰</b>（斜角不算）的</p><div class="box"><p>迫擊砲：移動後下回合<b>也能開火</b>，不用休息。</p><p>榴彈砲：可以跳過「準備」那一回合，裝填、發射兩回合一循環（裝填仍然要）。</p></div><p class="mut">如果你的砲或將軍被對手的偵察兵、間諜、無人機、雷達、衛星查到，那一個字會變<b style="color:#ff4d4d">紅色</b>提醒你，下一回合恢復。</p>`};
 if(pg==6)return tutExpose();
 return{scroll:true,txt:`<h2 style="margin:0 0 4px">⑧ 卡片</h2><p>遊戲有 <b>11 張卡片</b>，開局雙方就全部擁有。只要記住三件事：</p><div class="box"><p>① 計畫畫面底下的 <b>「🃏 卡片」</b> 按鈕，打開就是卡片區，每張卡都有 <b>「使用」</b> 按鈕。</p><p>② 每張卡有<b>冷卻或次數限制</b>，狀態寫在卡的旁邊（例如「冷卻中，還需 2 回合」），不用自己記。</p><p>③ <b>第 11 回合</b>有一張陸軍戰術飛彈是<b>強制使用</b>的，到時候畫面會先要你選目標。</p></div><p>卡片有三種用途：</p><div class="box"><p>🔍 <b>偵察兵</b>（情報）：指定一個小區，兩回合後公布那 9 格有什麼。</p><p>🛡 <b>偽裝網</b>（防守）：本回合擋掉對手的偵察、間諜、無人機、雷達。</p><p>💥 <b>轟炸機</b>（進攻）：選起點和方向，炸一條 6 格的線，格子裡的砲全部擊毀。</p></div><p class="mut">其餘的卡在卡片區裡都有一句話說明，邊玩邊看就行。</p>`};

function tutClick(el){
 const k=el.dataset.t,r=+el.dataset.r,c=+el.dataset.c,pg=TUT.page;
 if(k=="z"){TUT.z=subOf(r,c);sfx("tick");return render()}
 if(pg<2||pg>4)return;
 const g=["M","H","R"][pg-2],S=tutS(g),gu=TGUN[g],u={t:g,r:gu.r,c:gu.c},lim=g=="R"?3:1;
 if(S.lock)return;
 if(k=="m"){
  if(S.mode=="move"){if(r==gu.r&&c==gu.c)S.mv=null;else if(Math.abs(r-gu.r)+Math.abs(c-gu.c)>lim){S.msg="這門砲最多移動 "+lim+" 格。";return render()}else S.mv=[r,c];S.msg="";sfx("tick");return render()}
  if(r==gu.r&&c==gu.c){S.sel=true;S.msg="";sfx("sel"+g);return render()}
  S.msg="點你的砲（標著「"+CH[g]+"」的那一格）來選中它。";return render()}
 if(k=="e"){
  if(!S.sel){S.msg="先點自己陣地上的砲選中它。";return render()}
  if(S.mode!="fire"&&S.mode!="load"){S.msg=g=="H"?"先按「裝填並鎖定目標」。":"先按「開火」。";return render()}
  const cs=cellsFor(u,r,c);
  if(!cs){S.msg="2×2 方塊超出棋盤邊緣，換個格子。";return render()}
  if(!inRange(u,cs)){S.msg="超出射程了，選有黃框的格子。";return render()}
  S.tgt=cs;S.msg="";sfx("tick");return render()}}

function extraAct(a,el){
 if(a=="tut"){TUT={page:0,z:null,exp:null,S:{}};G.ph="tut";render();return true}
 if(a=="tnext"){TUT.page=Math.min(TP-1,TUT.page+1);render();return true}
 if(a=="tprev"){TUT.page=Math.max(0,TUT.page-1);render();return true}
 if(a=="tskip"){tutDone();return true}
 if(a=="tz"){TUT.z=+el.dataset.i;sfx("tick");render();return true}
 if(a=="tx"){TUT.exp=el.dataset.g;sfx("fire"+el.dataset.g);render();return true}
 if(a=="tg"){const g=el.dataset.g,S=tutS(g),op=el.dataset.op;
  if(op=="reset")TUT.S[g]=null;
  else if(op=="fire"||op=="load"||op=="move"){S.mode=op;S.msg=op=="move"?"點自己陣地上的格子（高亮的就是能到的）。":"點上方對手陣地選目標（有黃框的格子才打得到）。"}
  else if(op=="lock"){S.lock=true;S.mode=null;sfx("lock")}
  render();return true}
 if(a=="replay"){rpStart();return true}
 if(a=="shrphelp"){UI.sheet="rphelp";render();return true}
 if(a.startsWith("rp")){rpAct(a,el);return true}
 return false}

let RP={frames:[],i:0,timer:null};
const who=p=>G.mode=="cpu"?(p==1?"電腦":"你"):"玩家 "+(p+1);
function buildFrames(){
 const F=[],cl=u=>u.map(a=>a.map(x=>({...x}))),ruin=[mkb(),mkb()];let bad=0;
 G.hist.forEach((rec,i)=>{
  let st=cl(rec.start);const T0=rec.t;
  const push=(text,hl)=>F.push({turn:T0,text,units:cl(st),ruin:cp2(ruin),hl:hl||{}});
  const rm=id=>{st=st.map(a=>a.filter(x=>x.id!=id))};
  const mv=(p,id,to)=>{const x=st[p].find(q=>q.id==id);if(x){x.r=to[0];x.c=to[1]}};
  push(i==0?"開局佈陣：重播裡雙方的砲全部公開。":"回合開始。",{});
  rec.reinf.forEach(x=>{st[x.p].push({id:x.id,t:x.t,r:x.r,c:x.c});push(`${who(x.p)}使用<b>增援</b>：新迫擊砲出現在 ${lab(x.r,x.c)}，當回合就能開火。`,{to:[[x.p,x.r,x.c]]})});
  rec.cards.forEach(x=>push(`${who(x.p)}${x.text}。`,{}));
  rec.trans.forEach(x=>{mv(x.p,x.id,x.to);push(`${who(x.p)}用<b>${CARDS[x.k]}</b>把${NAME[x.ut||"M"]}從 ${lab(...x.from)} 送到 ${lab(...x.to)}（當回合就到${x.ut=="G"?"":"，本回合和下回合不能開火"}）。`,{from:[[x.p,...x.from]],to:[[x.p,...x.to]]})});
  const res=(e)=>{const a=[];if(e.hits.length)a.push("擊毀"+who(1-e.p)+"的"+e.hits.map(h=>NAME[h[2]]+"（"+lab(h[0],h[1])+"）").join("、"));if((e.gh||[]).length)a.push("命中"+who(1-e.p)+"的將軍（"+lab(e.gh[0][0],e.gh[0][1])+"），剩 "+Math.min(...e.gh.map(g=>g[2]))+" 顆愛心");return a.length?a.join("；"):"全部落空"};
  const hh=e=>e.hits.concat(e.gh||[]).map(h=>[1-e.p,h[0],h[1]]);
  rec.evs.forEach(e=>{
   if(e.kind=="shot")push(`${who(e.p)}的${NAME[e.t]}（${lab(...e.from)}）開火，暴露在 ${e.rv}：${res(e)}。`,{src:[[e.p,...e.from]],tgt:e.cells.map(x=>[1-e.p,...x]),hit:hh(e)});
   else if(e.kind=="bomb")push(`${who(e.p)}的<b>轟炸機</b>從 ${lab(...e.start)} 起${DIRS[e.dir]}炸 ${e.cells.length} 格：${res(e)}。`,{tgt:e.cells.map(x=>[1-e.p,...x]),hit:hh(e)});
   else{e.cells.forEach(([r,c])=>{ruin[1-e.p][r][c]=true});push(`${who(e.p)}的<b>陸軍戰術飛彈</b>命中以 ${lab(...e.center)} 為中心的 3×3：${res(e)}。這 9 格成為永久廢墟。`,{tgt:e.cells.map(x=>[1-e.p,...x]),hit:hh(e)})}});
  if(rec.dead.length){rec.dead.forEach(d=>rm(d.id));push("結算：被擊毀 "+rec.dead.map(d=>who(d.p)+"的"+NAME[d.t]+"（"+lab(d.r,d.c)+"）").join("、")+"。",{hit:rec.dead.map(d=>[d.p,d.r,d.c])})}
  rec.moves.forEach(x=>{mv(x.p,x.id,x.to);push(`${who(x.p)}的${NAME[x.t]}從 ${lab(...x.from)} 移到 ${lab(...x.to)}。`,{from:[[x.p,...x.from]],to:[[x.p,...x.to]]})});
  rec.loads.forEach(x=>push(`${who(x.p)}的榴彈砲（${lab(...x.from)}）裝填完畢，鎖定目標 ${x.cells.map(c=>lab(...c)).join(" ")}，下回合發射。`,{src:[[x.p,...x.from]],tgt:x.cells.map(c=>[1-x.p,...c])}));
  rec.resups.forEach(x=>push(`${who(x.p)}的火箭砲（${lab(...x.at)}）開始補彈，要停 2 回合。`,{src:[[x.p,...x.at]]}));
  [0,1].forEach(p=>{rec.revs[p].forEach(t=>push(`【${who(p)}得到的情報】${t}`,{}));rec.inbox[p].forEach(t=>push(`【${who(p)}收到的通知】${t}`,{}))});
  const a=JSON.stringify(st.map(x=>x.map(y=>[y.id,y.r,y.c]).sort())),b=JSON.stringify(rec.end.map(x=>x.map(y=>[y.id,y.r,y.c]).sort()));if(a!==b)bad++;
  st=cl(rec.end);push(`回合結束。${who(0)}剩 ${st[0].filter(x=>x.t!="G").length} 門砲，${who(1)}剩 ${st[1].filter(x=>x.t!="G").length} 門砲；將軍愛心 ${(st[0].find(x=>x.t=="G")||{hp:0}).hp} 對 ${(st[1].find(x=>x.t=="G")||{hp:0}).hp}。`,{})});
 const last=F[F.length-1];
 F.push({turn:last?last.turn:1,summary:true,text:summaryHTML(),units:last?last.units:[[],[]],ruin:last?last.ruin:[mkb(),mkb()],hl:{}});
 F.bad=bad;return F}
function summaryHTML(){
 const cnt=p=>{const a=G.units[p].filter(u=>u.alive),g=G.units[p].find(u=>u.t=="G");return["M","H","R"].map(t=>NAME[t]+"×"+a.filter(u=>u.t==t).length).join(" ")+(g?"；將軍"+(g.alive?"剩 "+g.hp+" 顆愛心":"陣亡"):"")};
 const kills=p=>{const l=G.lost[1-p];return"擊毀對手 "+(l.M+l.H+l.R)+" 門（迫擊砲 "+l.M+"、榴彈砲 "+l.H+"、火箭砲 "+l.R+"）"};
 const cards=p=>{const m={};G.cardlog[p].forEach(x=>{(m[x.k]=m[x.k]||[]).push(x.t)});const s=CORDER.filter(k=>m[k]).map(k=>CARDS[k]+(m[k].length>1?"×"+m[k].length:"")+"（第 "+m[k].join("、")+" 回合）");return s.length?s.join("；"):"沒有用過卡片"};
 return`<b>${G.over||""}</b> 一共打了 ${G.turn} 回合。`+[0,1].map(p=>`<br><b>${who(p)}</b>：${kills(p)}；最後剩 ${cnt(p)}。用過的卡：${cards(p)}。`).join("")}
function rpBoard(p,f){
 const rows=[...Array(R).keys()];if(p==1)rows.reverse();
 const has=(k,r,c)=>(f.hl[k]||[]).some(x=>x[0]==p&&x[1]==r&&x[2]==c);
 let h=`<div class="bd"><span class="lab">${fchar(p)}</span>`+Array.from({length:C},(_,i)=>`<span class="lab">${i+1}</span>`).join("");
 rows.forEach(r=>{h+=`<span class="lab">${String.fromCharCode(65+r)}</span>`;for(let c=0;c<C;c++){
  const u=f.units[p].find(x=>x.r==r&&x.c==c);let cls="";
  if(f.ruin[p][r][c])cls+=" ruin";if(u)cls+=" u"+p+(u.t=="G"?" gen":"");
  if(has("src",r,c))cls+=" hs";if(has("tgt",r,c))cls+=" ht";if(has("hit",r,c))cls+=" hh";if(has("from",r,c))cls+=" hf";if(has("to",r,c))cls+=" hto";
  h+=`<div class="cell z${Math.floor(c/3)}${cls}">${u?CH[u.t]:(has("from",r,c)?"○":"")}</div>`}});
 return h+"</div>"}
function rpStart(){RP.frames=buildFrames();RP.i=0;if(RP.timer){clearInterval(RP.timer);RP.timer=null}RP.playing=false;G.ph="replay";UI.sheet=null;render()}
function replayHTML(){
 const turns=[...new Set(RP.frames.map(f=>f.turn))];
 const top=`<span class="tt">戰爭日誌（重播）</span><button data-a="shrphelp">❓</button><button data-a="rpexit">✕ 返回</button>${muteBtn()}`;
 const dock=`<div class="box rpt" id="rpText"></div><div class="row"><button class="sm" data-a="rpprevT">⏮ 上回合</button><button class="sm" data-a="rpprev">◀</button><button class="sm main grow" id="rpPlayBtn" data-a="rpplay">▶ 播放</button><button class="sm" data-a="rpnext">▶</button><button class="sm" data-a="rpnextT">下回合 ⏭</button></div><div class="row"><input type="range" id="rpSlider" min="0" max="${RP.frames.length-1}" value="0" data-a="rpslide" style="flex:1;min-width:0"><select id="rpTurn" data-a="rpturn">${turns.map(t=>`<option value="${t}">第 ${t} 回合</option>`).join("")}<option value="end">總結</option></select></div>`;
 return shell(top,`<div id="rpBoards"></div>`,dock,2)+sheetHTML()}
function rpUpdate(){
 const f=RP.frames[RP.i];if(!f)return;
 const b=$("#rpBoards"),t=$("#rpText"),s=$("#rpSlider"),sel=$("#rpTurn"),pb=$("#rpPlayBtn");
 if(b)b.innerHTML=rpBoard(1,f)+'<div class="mid">中線</div>'+rpBoard(0,f);
 if(t)t.innerHTML=(f.summary?"<b>總結</b> ":`<b>第 ${f.turn} 回合</b> <span class="mut">${RP.i+1}/${RP.frames.length}</span> `)+f.text;
 if(s)s.value=RP.i;if(sel)sel.value=f.summary?"end":String(f.turn);
 if(pb)pb.textContent=RP.playing?"⏸ 暫停":"▶ 播放"}
function rpGo(i){RP.i=Math.max(0,Math.min(RP.frames.length-1,i));rpUpdate()}
function rpStop(){if(RP.timer){clearInterval(RP.timer);RP.timer=null}RP.playing=false}
function rpAct(a,el){
 if(a=="rpplay"){if(RP.playing){rpStop();rpUpdate();return}
  if(RP.i>=RP.frames.length-1)RP.i=0;RP.playing=true;RP.timer=setInterval(()=>{if(RP.i>=RP.frames.length-1){rpStop();rpUpdate();return}rpGo(RP.i+1)},1500);rpUpdate();return}
 if(a=="rpprev"){rpStop();rpGo(RP.i-1);return}
 if(a=="rpnext"){rpStop();rpGo(RP.i+1);return}
 if(a=="rpprevT"||a=="rpnextT"){rpStop();const f=RP.frames[RP.i],ts=[...new Set(RP.frames.map(x=>x.turn))],firstOf=t=>RP.frames.findIndex(x=>x.turn==t);
  if(a=="rpnextT"){const nt=f.summary?null:ts[ts.indexOf(f.turn)+1];RP.i=nt==null?RP.frames.length-1:firstOf(nt)}
  else if(f.summary||RP.i>firstOf(f.turn))RP.i=firstOf(f.turn);
  else RP.i=firstOf(ts[Math.max(0,ts.indexOf(f.turn)-1)]);
  rpUpdate();return}
 if(a=="rpexit"){rpStop();G.noAnim=true;G.ph="result";UI.sheet=null;render();return}}
document.addEventListener("input",e=>{const t=e.target;if(t&&t.id=="rpSlider"){rpStop();rpGo(+t.value)}});
document.addEventListener("change",e=>{const t=e.target;if(t&&t.id=="rpTurn"){rpStop();const v=t.value;RP.i=v=="end"?RP.frames.length-1:RP.frames.findIndex(x=>x.turn==+v);rpUpdate()}});

/* ===== 電腦對手：只使用公開信息（對方開火時的暴露區域、我方射擊的命中/落空結果、已擊毀的砲種數、卡片情報） ===== */
function cpuSetup(p,d){
 G.units[p]=[];const used=new Set(),all=rg(0,C-1),cols=z=>rg(3*z,3*z+2);
 const put=(t,rs,cs)=>{let r,c,k=0;do{r=pick(rs);c=pick(cs);k++}while(used.has(r+","+c)&&k<500);used.add(r+","+c);G.units[p].push({id:++ID,t,r,c,alive:true,noFire:false,st:0,tgt:null,ammo:6,rs:0,hp:5})};
 const putG=()=>{const gs=G.units[p].filter(u=>u.t=="M"||u.t=="H");let cs=[];if(d>0)gs.forEach(u=>[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const r=u.r+a,c=u.c+b;if(r>=0&&r<R&&c>=0&&c<C&&!used.has(r+","+c)&&(d==2?r>=2:true))cs.push([r,c])}));
  if(cs.length&&(d==2||Math.random()<.6)){const[r,c]=pick(cs);used.add(r+","+c);G.units[p].push({id:++ID,t:"G",r,c,alive:true,noFire:false,st:0,tgt:null,ammo:6,rs:0,hp:5})}else put("G",d==0?rg(0,5):rg(2,5),all)};
 if(d==0){qFor(p).filter(t=>t!="G").forEach(t=>put(t,rg(0,5),all));putG()}
 else if(d==1){qFor(p).filter(t=>t!="G").forEach(t=>put(t,t=="M"?rg(0,3):t=="H"?rg(1,4):rg(3,5),all));putG()}
 else{const z=shuf([0,1,2]);put("H",rg(1,3),cols(z[0]));put("H",rg(1,3),cols(z[1]));put("R",rg(4,5),all);if(G.easy&&p==0)put("R",rg(4,5),all);shuf([0,1,2]).forEach(k=>put("M",rg(0,2),cols(k)));putG()}}

function aiHeat(p,d){
 const L=G.lost[1-p],c0=cnt0(1-p),rem={M:c0.M-L.M,H:c0.H-L.H,R:c0.R-L.R},mk1=G.marks[p],now=G.turn,ex=G.seen[p],last=(a,n)=>n>0?a.slice(-n):[];
 const add=Array.from({length:R},()=>Array(C).fill(0)),zero=new Set();
 last(ex.filter(e=>e.t=="M"),rem.M).forEach(e=>{const w=3*Math.pow(.8,Math.max(0,now-e.turn-1));for(let r=0;r<R;r++)for(let c=e.c0;c<=e.c1;c++)add[r][c]+=w});
 const sk={},hs=[];ex.filter(e=>e.t=="H").forEach(e=>{const k=e.c0+","+e.r0;if(!sk[k]){sk[k]=1;hs.push(e)}});
 last(hs,rem.H).forEach(e=>{const cs=[];for(let r=e.r0;r<=e.r1;r++)for(let c=e.c0;c<=e.c1;c++)if(!mk1[r][c])cs.push([r,c]);
  const w=d==2?36/Math.max(1,cs.length):4;cs.forEach(([r,c])=>add[r][c]+=w)});
 last(ex.filter(e=>e.t=="R"),rem.R).forEach(e=>{const a=Math.max(0,now-e.turn-1),f=Math.pow(.6,a);add[e.r0][e.c0]+=5*f;
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const r=e.r0+dr,c=e.c0+dc;if(r>=0&&r<R&&c>=0&&c<C)add[r][c]+=2*f});
  if(d==2){const cs=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(Math.abs(r-e.r0)+Math.abs(c-e.c0)<=3)cs.push([r,c]);cs.forEach(([r,c])=>add[r][c]+=25*Math.pow(.75,a)/cs.length)}});
 /* 卡片情報：精確位置、小區、雷達推算、已知為空的格子 */
 G.rev[p].forEach(rv=>{
  (rv.items||[]).forEach(i=>{add[i.r][i.c]+=d==2?30:15});
  (rv.empties||[]).forEach(([r,c])=>zero.add(r+","+c));
  if(rv.kind=="drone"&&rv.area)rv.area.forEach(([r,c])=>add[r][c]+=d==2?3:1.5);
  if(rv.kind=="radar"&&rv.to)add[rv.to[0]][rv.to[1]]+=d==2?25:10});
 for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(mk1[r][c]=="g"&&now-G.xt[p][r][c]<=1)for(let a=0;a<R;a++)for(let b=0;b<C;b++){const k=Math.abs(a-r)+Math.abs(b-c);if(k>0&&k<=2)add[a][b]+=(d==2?3:1.5)/k}
 const nz=d==2?.12:.5;
 return add.map((row,r)=>row.map((a,c)=>{let v=1+a;const m=mk1[r][c];if(m=="g"){if(now-G.xt[p][r][c]<=1)v*=1;else v*=.7}else if(m=="#")v*=.03;else if(m=="x")v*=d==2?.35:.7;else if(m)v*=.3;if(zero.has(r+","+c))v*=.1;return Math.max(.01,v*(1+(Math.random()*2-1)*nz))}))}

function cpuPlan(p,d){
 const t=G.turn,o=1-p,P=G.plans[p]={},cp=G.cp[p]={};
 const h=d?aiHeat(p,d):null,pen=d==2?.15:.5,dests=new Set();
 const free=(r,c)=>!G.ruin[p][r][c]&&!G.units[p].some(x=>x.alive&&x.r==r&&x.c==c)&&!dests.has(r+","+c);
 const L=G.lost[o],eRem={M:Math.max(0,cnt0(o).M-L.M),H:Math.max(0,cnt0(o).H-L.H),R:Math.max(0,cnt0(o).R-L.R)},eTot=eRem.M+eRem.H+eRem.R;
 const kn=known(p),knN=kn.M.length+kn.H.length+kn.R.length,ok=k=>!cardWhy(p,k);
 const sumHeat=cells=>cells.reduce((s,[a,b])=>s+(h?h[a][b]:1),0);
 const notRuin=cells=>cells.filter(([a,b])=>!G.ruin[o][a][b]);
 /* 第 11 回合：強制陸軍戰術飛彈 */
 if(msT(t)&&ok("missile")){let best={r:rnd(R),c:rnd(C)};
  if(h){let bs=-1;for(let r=0;r<R;r++)for(let c=0;c<C;c++){const s=sumHeat(notRuin(blk3({r,c})))*(1+Math.random()*.001);if(s>bs){bs=s;best={r,c}}}}
  cp.missile=best;if(h)blk3(best).forEach(([a,b])=>h[a][b]*=pen)}
 /* 增援：原來的迫擊砲全毀後立刻用 */
 if(ok("reinf")){let cs=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(free(r,c)&&(d==0||r<=3))cs.push([r,c]);
  if(!cs.length)for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(free(r,c))cs.push([r,c]);
  if(cs.length){const[r,c]=pick(cs),nu={id:++ID,t:"M",r,c,alive:true,noFire:false,st:0,tgt:null,ammo:6,rs:0,hp:5};G.units[p].push(nu);cp.reinf={id:nu.id}}}
 /* 直升機：把被暴露的迫擊砲送到沒被暴露的大區 */
 let tr=null;
 if(d>0&&ok("heli")){const kz=known(o).M,mz=G.units[p].filter(u=>u.alive&&u.t=="M"&&kz.some(e=>u.c>=e.c0&&u.c<=e.c1));
  if(mz.length&&Math.random()<[0,.35,.7][d]){const u=pick(mz);let cs=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(free(r,c)&&!kz.some(e=>c>=e.c0&&c<=e.c1))cs.push([r,c]);
   if(!cs.length)for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(free(r,c))cs.push([r,c]);
   if(cs.length){const[r,c]=pick(cs);cp.heli={id:u.id,r,c};dests.add(r+","+c);tr=u}}}
 /* 情報與防守類卡片 */
 if(ok("scout")){let use=false,zi=rnd(6);
  if(!h)use=Math.random()<.12;
  else{let bs=-1;SUBN.forEach((_,i)=>{const s=sumHeat(subCells(i));if(s>bs){bs=s;zi=i}});use=d==2||Math.random()<.6}
  if(use)cp.scout=zi}
 if(ok("spy")){const u=d==0?Math.random()<.08:d==1?(eTot-knN>=3&&Math.random()<.5):(eTot<=2||(t>=8&&knN<=1));if(u)cp.spy=true}
 if(ok("drone")&&eRem.M>0){const u=d==0?Math.random()<.1:d==1?(kn.M.length>0&&Math.random()<.5):true;if(u)cp.drone=true}
 if(ok("camo")){const u=d==0?false:d==1?Math.random()<.2:(t>=4&&Math.random()<.3);if(u)cp.camo=true}
 if(ok("radar")&&eRem.R>0){const u=d==0?(t==20&&Math.random()<.5):d==1?(G.easy?Math.random()<.3:t==19):t==18;if(u)cp.radar=true}
 if(ok("sat")){const u=d==0?(t==20&&Math.random()<.5):d==1?Math.random()<.5:t==19;if(u)cp.sat=true}
 /* 轟炸機 */
 if(ok("bomb")){let best=null,bs=-1;
  if(!h){if(Math.random()<.25)best={r:rnd(R),c:rnd(C),d:pick(Object.keys(DIRV))}}
  else{for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const dd of Object.keys(DIRV)){const s=sumHeat(notRuin(lineCells({r,c,d:dd})))*(1+Math.random()*.001);if(s>bs){bs=s;best={r,c,d:dd}}}
   if(!(bs>=(d==2?9:8)||t>=7))best=null;if(d==1&&Math.random()<.2)best=null}
  if(best){cp.bomb=best;if(h)lineCells(best).forEach(([a,b])=>h[a][b]*=pen)}}
 /* 砲：開火與移動 */
 const mine=G.units[p].filter(u=>u.alive);
 const occ=(r,c,s)=>G.ruin[p][r][c]||mine.some(x=>x!==s&&x.r==r&&x.c==c)||dests.has(r+","+c);
 const moves=(u,lim)=>{const o2=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++){const k=Math.abs(r-u.r)+Math.abs(c-u.c);if(k>0&&k<=lim&&!occ(r,c,u))o2.push([r,c,k])}return o2};
 const amin=(a,f)=>{let b=null,bv=1e9;a.forEach(x=>{const v=f(x);if(v<bv){bv=v;b=x}});return b};
 const go=(pl,q)=>{pl.move=[q[0],q[1]];dests.add(q[0]+","+q[1])};
 const choose=u=>{
  if(!h){const o2=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++){const cs=cellsFor(u,r,c);if(cs&&inRange(u,cs))o2.push(cs)}return o2.length?pick(o2):null}
  let bs=-1,bc=null;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const cs=cellsFor(u,r,c);if(!cs||!inRange(u,cs))continue;const s=cs.reduce((x,[a,b])=>x+h[a][b],0);if(s>bs){bs=s;bc=cs}}
  if(bc)bc.forEach(([a,b])=>h[a][b]*=pen);return bc};
 if(h)mine.forEach(u=>{if(u.t=="H"&&u.st==1)u.tgt.forEach(([a,b])=>h[a][b]*=pen)});
 [...mine].sort((a,b)=>"GRHM".indexOf(a.t)-"GRHM".indexOf(b.t)).forEach(u=>{const pl=P[u.id]={};
  if(u.t=="G"){pl.lock=true;if(u===tr)return;
   const danger=d>0&&(G.spot[p].includes(u.id)||(G.events||[]).some(e=>e.p==o&&(e.gh||[]).length)),gp=mine.filter(x=>x.t=="M"||x.t=="H");
   const cands=[[u.r,u.c,0],...moves(u,2)];let bq=null,bv=-1e9;
   cands.forEach(q=>{const adj=gp.filter(x=>Math.abs(x.r-q[0])+Math.abs(x.c-q[1])==1).length;let s=(d>0?Math.min(adj,2)*1.2:0)+Math.random()*(d==0?3:1);if(danger)s+=q[2]*2.2;if(d==2)s-=Math.abs(q[0]-4)*.12;if(!danger&&q[2]==0)s+=.6;if(s>bv){bv=s;bq=q}});
   if(bq&&bq[2]>0&&(d>0||Math.random()<.3))go(pl,bq);return}
  if(u===tr){pl.lock=true;return}
  if(u.t=="H"){if(canLoad(u)){const cs=choose(u);if(cs)pl.load=cs}}
  else if(u.t=="M"){
   if(canFire(u)){const cs=choose(u);if(cs)pl.fire=cs}
   if(pl.fire&&Math.random()<[.5,.25,.15][d]){const m=moves(u,1);if(m.length)go(pl,pick(m))}}
  else if(!u.rs){
   const need=u.ammo<=[0,1,2][d];
   if(need&&u.r>=4&&u.ammo<4)pl.resup=true;
   else{
    if(u.ammo>0){const cs=choose(u);if(cs)pl.fire=cs}
    if(need&&u.r<4){const q=amin(moves(u,3),m=>Math.max(0,4-m[0])*3+Math.random()*.3);if(q)go(pl,q)}
    else if(pl.fire&&(d>0||Math.random()<.3)){const q=amin(moves(u,3),m=>-m[2]+(d==2?Math.abs(m[0]-4.5)*.15:0)+Math.random()*(d==2?1.2:2));if(q)go(pl,q)}}}
  pl.lock=true})}


init();if(firstRun())G.ph="tut";render();
</script>
